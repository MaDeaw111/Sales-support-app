<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        :root {
            --ui-radius-card: 14px;
            --ui-radius-control: 10px;
            --ui-border: #e2e8f0;
            --ui-surface: #ffffff;
            --ui-surface-soft: #f8fafc;
            --ui-page: #f6f8fb;
            --ui-text: #0f172a;
            --ui-muted: #64748b;
            --ui-primary: #2563eb;
            --ui-primary-hover: #1d4ed8;
            --ui-success: #059669;
            --ui-success-hover: #047857;
            --ui-shadow-card: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.035);
        }
        body { font-family: 'Sarabun', sans-serif; background: var(--ui-page); color: var(--ui-text); }
        .app-header { box-shadow: 0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(15,23,42,.12); }
        .app-sidebar { min-width: 16rem; }
        .app-main { background: var(--ui-page); }
        .ui-card { background: var(--ui-surface); border: 1px solid var(--ui-border); border-radius: var(--ui-radius-card); box-shadow: var(--ui-shadow-card); }
        .ui-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; min-height:36px; padding:.5rem .8rem; border-radius:var(--ui-radius-control); font-size:.75rem; font-weight:700; line-height:1; transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .15s ease; }
        .ui-btn:hover { transform: translateY(-1px); }
        .ui-btn-primary { background:var(--ui-primary); color:#fff; border:1px solid var(--ui-primary); }
        .ui-btn-primary:hover { background:var(--ui-primary-hover); border-color:var(--ui-primary-hover); }
        .ui-btn-secondary { background:#fff; color:#334155; border:1px solid var(--ui-border); }
        .ui-btn-secondary:hover { background:var(--ui-surface-soft); border-color:#cbd5e1; }
        .ui-btn-success { display:inline-flex; align-items:center; justify-content:center; gap:.375rem; min-height:34px; padding:.45rem .75rem; border-radius:var(--ui-radius-control); background:var(--ui-success); color:#fff; font-size:.75rem; font-weight:700; transition:background-color .15s ease,transform .15s ease,box-shadow .15s ease; }
        .ui-btn-success:hover { background:var(--ui-success-hover); transform:translateY(-1px); }
        .ui-input { width:100%; min-height:38px; border:1px solid var(--ui-border); border-radius:var(--ui-radius-control); background:#fff; padding:.55rem .7rem; font-size:.75rem; color:#0f172a; outline:none; transition:border-color .15s ease,box-shadow .15s ease; }
        .ui-input:focus { border-color:#93c5fd; box-shadow:0 0 0 3px rgba(37,99,235,.10); }
        .ui-select-dark { border:1px solid #334155; border-radius:8px; min-height:30px; padding:.25rem .5rem; }
        .ui-table { width:100%; border-collapse:separate; border-spacing:0; }
        .ui-table thead th { white-space:nowrap; letter-spacing:.02em; }
        .ui-table tbody tr { transition:background-color .12s ease; }
        .ui-table tbody tr:hover { background:#f8fafc; }
        .ui-modal-backdrop { background:rgba(15,23,42,.64); backdrop-filter:blur(5px); }
        .ui-modal-shell { background:#fff; border:1px solid rgba(226,232,240,.9); border-radius:16px; box-shadow:0 24px 80px rgba(15,23,42,.28); }
        .ui-page-title { font-size:1.25rem; line-height:1.75rem; font-weight:800; color:#0f172a; letter-spacing:-.01em; }
        .ui-page-subtitle { margin-top:.25rem; font-size:.75rem; color:#64748b; }
        button, input, select, textarea { transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease, color .15s ease; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:3px solid rgba(37,99,235,.22); outline-offset:2px; }
        input:not([type='checkbox']):not([type='radio']), select, textarea { border-radius:var(--ui-radius-control); }
        [class~='bg-white'][class~='rounded-xl'][class~='border'][class~='border-slate-200'] { box-shadow:var(--ui-shadow-card); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .multi-day-bar { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <script>
        // Keep prototype usable when external icon CDN is blocked or slow.
        window.lucide = window.lucide || { createIcons: function() {} };


        // ==============================
        // AUTHENTICATION - LOGIN V1
        // ==============================
        const AUTH_STORAGE_KEY = 'wcat_session_token_v1';

        function getStoredSessionToken() {
            try { return localStorage.getItem(AUTH_STORAGE_KEY) || ''; } catch (e) { return ''; }
        }

        function storeSessionToken(token) {
            try {
                if (token) localStorage.setItem(AUTH_STORAGE_KEY, token);
                else localStorage.removeItem(AUTH_STORAGE_KEY);
            } catch (e) {}
        }

        function setLoginError(message) {
            const el = document.getElementById('loginError');
            if (!el) return;
            el.textContent = message || '';
            el.classList.toggle('hidden', !message);
        }

        function setLoginBusy(busy) {
            const btn = document.getElementById('loginButton');
            if (!btn) return;
            btn.disabled = !!busy;
            btn.textContent = busy ? 'Signing in...' : 'Sign in';
            btn.classList.toggle('opacity-60', !!busy);
        }

        function showLoginScreen(message = '') {
            document.getElementById('loginScreen')?.classList.remove('hidden');
            document.getElementById('appHeader')?.classList.add('hidden');
            document.getElementById('appWorkspace')?.classList.add('hidden');
            setLoginError(message);
        }

        function showAuthenticatedShell(showWorkspace = true) {
            document.getElementById('loginScreen')?.classList.add('hidden');
            document.getElementById('appHeader')?.classList.remove('hidden');
            document.getElementById('appWorkspace')?.classList.toggle('hidden', !showWorkspace);
        }

        function applyAuthenticatedUser(user) {
            if (!user) return;
            state.currentUser = {
                id: user.user_id,
                name: user.full_name,
                role: user.role,
                email: user.email,
                customerScope: user.customer_scope,
                mustChangePassword: !!user.must_change_password
            };
            const nameEl = document.getElementById('authUserName');
            const roleEl = document.getElementById('authUserRole');
            const avatar = document.getElementById('userAvatar');
            if (nameEl) nameEl.textContent = user.full_name || user.email || 'User';
            if (roleEl) roleEl.textContent = String(user.role || '').replaceAll('_', ' ');
            if (avatar) {
                const parts = String(user.full_name || user.email || 'WC').trim().split(/\s+/).filter(Boolean);
                avatar.textContent = (parts[0]?.[0] || 'W') + (parts[1]?.[0] || parts[0]?.[1] || 'C');
            }
        }

        async function submitLogin(event) {
            if (event) event.preventDefault();
            const email = document.getElementById('loginEmail')?.value.trim() || '';
            const password = document.getElementById('loginPassword')?.value || '';
            if (!email || !password) return setLoginError('Please enter email and password.');
            setLoginError('');
            setLoginBusy(true);
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const res = await response.json().catch(() => null);
                if (!response.ok || res?.status !== 'SUCCESS' || !res?.data?.user) {
                    return setLoginError(res?.message || 'Unable to sign in.');
                }
                const user = res.data.user;
                applyAuthenticatedUser(user);
                document.getElementById('loginPassword').value = '';
                if (user.must_change_password) {
                    showAuthenticatedShell(false);
                    openChangePasswordModal(true);
                    return;
                }
                startAuthenticatedApp();
            } catch (err) {
                setLoginError(err?.message || 'Login failed.');
            } finally {
                setLoginBusy(false);
            }
        }

        async function bootstrapAuth() {
            try {
                const response = await fetch('/api/auth/me', { method: 'GET' });
                const res = await response.json().catch(() => null);
                if (!response.ok || res?.status !== 'SUCCESS' || !res?.data?.valid || !res?.data?.user) {
                    return showLoginScreen('');
                }
                const user = res.data.user;
                applyAuthenticatedUser(user);
                if (user.must_change_password) {
                    showAuthenticatedShell(false);
                    openChangePasswordModal(true);
                } else {
                    startAuthenticatedApp();
                }
            } catch (err) {
                showLoginScreen('Unable to validate session. Please sign in again.');
            }
        }

        async function loadPriceNotesFromApi() {
            try {
                const filters = state.priceNotesFilters || {};
                const params = new URLSearchParams();
                if (filters.salesUserId) params.set('salesUserId', filters.salesUserId);
                if (filters.customerId) params.set('customerId', filters.customerId);
                if (filters.productId) params.set('productId', filters.productId);

                const res = await fetch('/api/manager-price-notes?' + params.toString());
                if (!res.ok) return;
                const body = await res.json();
                if (body && body.status === 'SUCCESS' && body.data && Array.isArray(body.data.priceNotes)) {
                    state.priceNotes = body.data.priceNotes;
                    renderView();
                }
            } catch (err) {
                console.error('Failed to load price notes:', err);
            }
        }

        async function savePriceNoteToApi(payload) {
            const res = await fetch('/api/manager-price-notes', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const errBody = await res.json();
                throw new Error(errBody.message || 'Failed to save price note');
            }
            const body = await res.json();
            return body.data.priceNote;
        }

        function openChangePasswordModal(forced = false) {
            const title = forced ? 'Change Temporary Password' : 'Change Password';
            openModal(`<div class="space-y-4">
                <div><div class="text-[10px] font-black uppercase tracking-wider text-blue-600">Account Security</div><h3 class="text-lg font-black text-slate-900">${title}</h3><p class="text-xs text-slate-500 mt-1">${forced ? 'You must change your temporary password before continuing.' : 'Use at least 8 characters.'}</p></div>
                <label class="text-xs font-bold text-slate-600 block">Current Password<input id="authOldPassword" type="password" autocomplete="current-password" class="ui-input mt-1"></label>
                <label class="text-xs font-bold text-slate-600 block">New Password<input id="authNewPassword" type="password" autocomplete="new-password" class="ui-input mt-1"></label>
                <label class="text-xs font-bold text-slate-600 block">Confirm New Password<input id="authConfirmPassword" type="password" autocomplete="new-password" class="ui-input mt-1"></label>
                <div id="authPasswordError" class="hidden rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-xs font-bold text-rose-700"></div>
                <div class="flex justify-end gap-2">${forced ? '' : '<button onclick="closeModal()" class="ui-btn ui-btn-secondary">Cancel</button>'}<button onclick="submitPasswordChange(${forced ? 'true' : 'false'})" class="ui-btn ui-btn-primary">Save Password</button></div>
            </div>`);
        }

        async function submitPasswordChange(forced = false) {
            const oldPassword = document.getElementById('authOldPassword')?.value || '';
            const newPassword = document.getElementById('authNewPassword')?.value || '';
            const confirmPassword = document.getElementById('authConfirmPassword')?.value || '';
            const errorEl = document.getElementById('authPasswordError');
            const fail = msg => { if (errorEl) { errorEl.textContent = msg; errorEl.classList.remove('hidden'); } };
            if (!oldPassword || !newPassword) return fail('Current and new password are required.');
            if (newPassword.length < 8) return fail('New password must be at least 8 characters.');
            if (newPassword !== confirmPassword) return fail('New password confirmation does not match.');
            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password: oldPassword, new_password: newPassword })
                });
                const res = await response.json().catch(() => null);
                if (!response.ok || res?.status !== 'SUCCESS') return fail(res?.message || 'Unable to change password.');
                applyAuthenticatedUser(res.data?.user || state.currentUser);
                closeModal();
                if (forced) startAuthenticatedApp();
            } catch (err) {
                fail(err?.message || 'Unable to change password.');
            }
        }

        async function signOut() {

                state.currentUser = { id:'', name:'', role:'', email:'', customerScope:'' };
                showLoginScreen('Signed out successfully.');
                const email = document.getElementById('loginEmail');
                if (email) email.focus();
            };
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (err) {
                console.warn('Logout request failed:', err);
            } finally {
                finish();
            }
        }

        function getTodayIso() {
            return new Date().toISOString().slice(0, 10);
        }

        function isDateWithin(dateIso, startIso, endIso) {
            if (!dateIso) return false;
            if (startIso && dateIso < startIso) return false;
            if (endIso && dateIso > endIso) return false;
            return true;
        }

        function getSuggestedSellingPrice(customerId, productId, dateIso = getTodayIso()) {
            const special = (state.specialPrices || []).find(x =>
                x.customerId === customerId && x.productId === productId &&
                String(x.approvalStatus || '').toUpperCase() === 'APPROVED' &&
                (!x.validUntil || dateIso <= x.validUntil)
            );
            if (special) return { price: Number(special.approvedPriceUsd || 0), source: 'SPECIAL_PRICE', reference: special.id, record: special };

            const standard = (state.standardPrices || []).find(x =>
                x.productId === productId && String(x.status || '').toUpperCase() === 'ACTIVE' &&
                isDateWithin(dateIso, x.effectiveDate, x.validUntil)
            );
            if (standard) return { price: Number(standard.fobUsdPerMt || 0), source: 'STANDARD_FOB', reference: standard.id, record: standard };
            return { price: 0, source: 'NO_ACTIVE_PRICE', reference: '', record: null };
        }

                    remark

            if (!canManagePricing()) return alert('Only Manager or Admin can approve/reject Special Price.');

            if (!rec) return;
            rec.approvalStatus = decision === 'APPROVE' ? 'APPROVED' : 'REJECTED';
            renderPricing(document.getElementById('mainContent'));

        function pricingStatusBadge(status) {
            const s = String(status || '').toUpperCase();
            if (s === 'ACTIVE' || s === 'APPROVED') return '<span class="px-2 py-1 rounded bg-emerald-100 text-emerald-700 font-bold text-[10px]">'+s+'</span>';
            if (s === 'PENDING') return '<span class="px-2 py-1 rounded bg-amber-100 text-amber-700 font-bold text-[10px]">PENDING</span>';
            return '<span class="px-2 py-1 rounded bg-slate-100 text-slate-600 font-bold text-[10px]">'+(s || '-')+'</span>';
        }

        function getManagerDashboardAnalytics() {
            const f = state.managerDashboardFilters || { year:'2026', month:'ALL', salesOwnerId:'ALL', customerId:'ALL', productId:'ALL' };
            const allCustomers = state.customers || [], allPOs = state.pos || [], allDIs = (state.diRecords || []).filter(d=>d.status!=='CANCELLED');
            const customerMap = Object.fromEntries(allCustomers.map(c=>[c.id,c]));
            const poMap = Object.fromEntries(allPOs.map(p=>[p.id,p]));
            const productMap = Object.fromEntries((state.products||[]).map(p=>[p.id,p]));
            const scopePOs = allPOs.filter(p => {
                const c = customerMap[p.customerId];
                if (f.salesOwnerId !== 'ALL' && c?.ownerId !== f.salesOwnerId) return false;
                if (f.customerId !== 'ALL' && p.customerId !== f.customerId) return false;
                if (f.productId !== 'ALL' && p.productId !== f.productId) return false;
                return true;
            });
            const scopePoIds = new Set(scopePOs.map(p=>p.id));
            const scopeDIs = allDIs.filter(d=>scopePoIds.has(d.poId));
            const scopeDiIds = new Set(scopeDIs.map(d=>d.id));
            const year = String(f.year || '2026');
            const month = f.month || 'ALL';
            const dateMatches = (date) => {
                if (!date) return false;
                const [y,m] = String(date).split('-');
                if (year !== 'ALL' && y !== year) return false;
                if (month !== 'ALL' && String(Number(m)) !== String(Number(month))) return false;
                return true;
            };
            const contractPOs = scopePOs.filter(p=>dateMatches(p.poDate));
            const loadingEvents = (state.loadingEvents||[]).filter(e=>scopeDiIds.has(e.diId) && e.status!=='CANCELLED' && dateMatches(e.loadingDate));
            const shippedByDI = {};
            loadingEvents.forEach(e=>{ const di=scopeDIs.find(d=>d.id===e.diId); shippedByDI[e.diId]=(shippedByDI[e.diId]||0)+managerEventActualQty(e,di); });
            const contractMt = contractPOs.reduce((a,p)=>a+Number(p.contractQtyMt||0),0);
            const shippedMt = Object.values(shippedByDI).reduce((a,v)=>a+Number(v||0),0);
            const paymentRows = (state.paymentRecords||[]).filter(p=>scopeDiIds.has(p.diId) && dateMatches(p.paymentDate));
            const outstandingUsd = paymentRows.reduce((a,p)=>a+Math.max(0,Number(p.invoiceAmount||0)-Number(p.receivedAmount||0)),0);
            const commissionRows = typeof getCommissionRows === 'function' ? getCommissionRows().filter(r=>scopePoIds.has(r.poId)) : [];
            const payableCommission = commissionRows.filter(r=>r.status==='PAYABLE').reduce((a,r)=>a+Number(r.amountUsd||0),0);
            const months = Array.from({length:12},(_,i)=>i+1);
            let cumulativeContract=0, cumulativeShipped=0;
            const trend = months.map(m=>{
                const contract = scopePOs.filter(p=>String(p.poDate||'').startsWith(`${year}-${String(m).padStart(2,'0')}`)).reduce((a,p)=>a+Number(p.contractQtyMt||0),0);
                const shipped = (state.loadingEvents||[]).filter(e=>scopeDiIds.has(e.diId)&&e.status!=='CANCELLED'&&String(e.loadingDate||'').startsWith(`${year}-${String(m).padStart(2,'0')}`)).reduce((a,e)=>{const di=scopeDIs.find(d=>d.id===e.diId);return a+managerEventActualQty(e,di)},0);
                cumulativeContract += contract; cumulativeShipped += shipped;
                return { month:managerMonthLabel(m), contract, shipped, remaining:Math.max(0,cumulativeContract-cumulativeShipped) };
            });
            const shippedByCustomer = {}, shippedByProduct = {};
            loadingEvents.forEach(e=>{ const di=scopeDIs.find(d=>d.id===e.diId); const po=poMap[di?.poId]; const qty=managerEventActualQty(e,di); if(!po)return; shippedByCustomer[po.customerId]=(shippedByCustomer[po.customerId]||0)+qty; shippedByProduct[po.productId]=(shippedByProduct[po.productId]||0)+qty; });
            const topCustomers = Object.entries(shippedByCustomer).map(([id,value])=>({id,label:customerMap[id]?.name||id,value})).sort((a,b)=>b.value-a.value).slice(0,5);
            const productMix = Object.entries(shippedByProduct).map(([id,value])=>({id,label:productMap[id]?.shortName||id,value})).sort((a,b)=>b.value-a.value).slice(0,6);
            const paymentOverview = ['PAID','PARTIAL','UNPAID'].map(status=>({status,value:paymentRows.filter(p=>p.status===status).reduce((a,p)=>a+Number(p.invoiceAmount||0),0)}));
            const activePO = scopePOs.filter(p=>!['COMPLETED','CANCELLED'].includes(p.poStatus)).length;
            return { filters:f, scopePOs, scopeDIs, contractPOs, paymentRows, trend, topCustomers, productMix, paymentOverview, kpis:{activePO,contractMt,shippedMt,outstandingUsd,payableCommission} };

        function getExportReadinessRows() {
            const scopedDIs = getScopedDIRecords().filter(d => d.status !== 'CANCELLED');
            const poMap = Object.fromEntries((state.pos || []).map(p => [p.id, p]));
            const customerMap = Object.fromEntries((state.customers || []).map(c => [c.id, c]));
            const today = getTodayIso();
            const rows = [];
            (state.loadingEvents || []).filter(e => e.status !== 'CANCELLED').forEach(event => {
                const di = scopedDIs.find(d => d.id === event.diId);
                if (!di) return;
                const po = poMap[di.poId] || {};
                const customer = customerMap[po.customerId] || {};
                const forwarder = getDIForwarderAssignment(di.id);
                const trucks = getTruckBookingsForEvent(event.id);
                const planned = Number(event.plannedContainers || 0);
                const allocated = trucks.reduce((sum, t) => sum + Number(t.noOfContainers || 0), 0);
                const surveys = getSurveyAssignmentsForEvent(event.id);
                const surveyPending = surveys.some(x => ['PENDING','BOOKED'].includes(x.status));
                const days = dashboardDateDiffDays(today, event.loadingDate);
                const bookingOk = !!di.booking && di.booking.status !== 'CANCELLED';
                const wcatOk = !!di.wcatNo;
                const forwarderOk = !!forwarder;
                const truckOk = planned === 0 || allocated >= planned;
                const surveyOk = !surveyPending;
                let readiness = 'READY';
                if (!bookingOk || !wcatOk) readiness = 'BLOCKED';
                else if (!forwarderOk || !truckOk || !surveyOk) readiness = (days !== null && days <= 3) ? 'AT RISK' : 'AT RISK';
                rows.push({ di, po, customer, event, forwarder, trucks, surveys, planned, allocated, surveyPending, days, bookingOk, wcatOk, forwarderOk, truckOk, surveyOk, readiness });
            });
            return rows.sort((a,b) => String(a.event.loadingDate || '').localeCompare(String(b.event.loadingDate || '')) || Number(a.event.sequenceNo||0)-Number(b.event.sequenceNo||0));
        }

        function exportReadinessBadge(status) {
            const cls = status === 'READY' ? 'bg-emerald-100 text-emerald-700' : status === 'BLOCKED' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-800';
            return `<span class="px-2 py-1 rounded-full text-[9px] font-black ${cls}">${status}</span>`;
        }

ctive loading events</div>`}</div></div>`;

        function renderExportPartnerSnapshot() {

        function getSalesSupportDashboardData() {
            const customers = getScopedCustomers();

            const dis = getScopedDIRecords().filter(d => d.status !== 'CANCELLED');
            const payments = getDashboardPaymentRecords();
            const customerById = Object.fromEntries(customers.map(c => [c.id, c]));
            const poById = Object.fromEntries(pos.map(p => [p.id, p]));
            const productById = Object.fromEntries((state.products || []).map(p => [p.id, p]));

            return { customers, pos, dis, payments, customerById, poById, productById, diByPO, payByDI };
        }

        function getSalesSupportNextAction(customerId, data) {
            const customerPOs = data.pos.filter(p => p.customerId === customerId && !['COMPLETED','CANCELLED'].includes(p.poStatus));
            if (!customerPOs.length) return { label:'Customer follow-up', view:'customers', tone:'slate' };
            for (const po of customerPOs) {
                if (po.commercialApprovalStatus === 'NEEDS_APPROVAL') return { label:'PO waiting approval', view:'po_engine', tone:'amber' };
                const ds = data.diByPO.get(po.id) || [];
                if (!ds.length) return { label:'Create DI', view:'po_engine', tone:'blue' };
                if (ds.some(d => !d.wcatNo)) return { label:'Assign WCAT', view:'shipping', tone:'amber' };
                if (ds.some(d => !d.booking)) return { label:'Follow up booking', view:'shipping', tone:'fuchsia' };
                if (ds.some(d => { const p=data.payByDI.get(d.id); return p && ['UNPAID','PARTIAL'].includes(p.status); })) return { label:'Payment follow-up', view:'payments', tone:'rose' };
            }
            return { label:'Monitor shipment', view:'shipping', tone:'emerald' };
        }

        function getSalesSupportLastActivity(customerId, data) {
            const dates = [];
            data.pos.filter(p=>p.customerId===customerId).forEach(p=>{ if(p.poDate) dates.push({date:p.poDate,label:'PO'}); });
            data.dis.filter(d=>data.poById[d.poId]?.customerId===customerId).forEach(d=>{
                if (d.booking?.etd) dates.push({date:d.booking.etd,label:'Booking / ETD'});
                getDILoadingEvents(d.id).forEach(e=>{ if(e.loadingDate) dates.push({date:e.loadingDate,label:`Loading ${e.status||''}`.trim()}); });

        function getExternalSalesDashboardData() {
            const customers = getScopedCustomers();

                ? getCommissionRows().filter(r => r.recipientId === state.currentUser.id)
                : [];

            const outstandingUsd = payments.reduce((sum, p) => sum + Math.max(0, (Number(p.invoiceAmount)||0) - (Number(p.receivedAmount)||0)), 0);
            const payableCommission = commissionRows.filter(r => r.status === 'PAYABLE').reduce((sum, r) => sum + (Number(r.amountUsd)||0), 0);
            const paidCommission = commissionRows.filter(r => r.status === 'PAID').reduce((sum, r) => sum + (Number(r.amountUsd)||0), 0);
            const pendingCommission = commissionRows.filter(r => r.status === 'PENDING').reduce((sum, r) => sum + (Number(r.amountUsd)||0), 0);
            const specialPrices = (state.specialPrices||[]).filter(x => customerIds.has(x.customerId));

        function getProductionOrderRows() {
            return getScopedDIRecords().filter(di => di.status !== 'CANCELLED').map(di => {
                const po=(state.pos||[]).find(p=>p.id===di.poId)||{};
                const customer=(state.customers||[]).find(c=>c.id===po.customerId)||{};
                const product=(state.products||[]).find(p=>p.id===po.productId)||{};
                const qtyMt=((+di.packageWeightKg||0)*(+di.bagsPerContainer||0)*(+di.plannedContainers||0))/1000;
                return {di,po,customer,product,qtyMt,targetLoadingDate:di.targetLoadingDate||'-',status:di.productionStatus||'WAITING_PLAN'};
            }).sort((a,b)=>String(a.targetLoadingDate).localeCompare(String(b.targetLoadingDate)));
        }
        function productionStatusMeta(status){const m={WAITING_PLAN:['Waiting Plan','slate'],PRODUCTION:['Production','blue'],PACKING:['Packing','amber'],WAREHOUSE_READY:['Warehouse Ready','emerald'],HOLD:['Hold','rose']};const x=m[status]||m.WAITING_PLAN;return {label:x[0],tone:x[1]};}
        function productionStatusBadge(status){const m=productionStatusMeta(status);const cls={slate:'bg-slate-100 text-slate-700',blue:'bg-blue-100 text-blue-700',amber:'bg-amber-100 text-amber-800',emerald:'bg-emerald-100 text-emerald-700',rose:'bg-rose-100 text-rose-700'}[m.tone];return `<span class="inline-flex px-2 py-1 rounded-full text-[10px] font-black ${cls}">${m.label}</span>`;}
        function applyProductionStatusChange(di,newStatus,statusDate,note='',holdReason=''){
            const allowed=['WAITING_PLAN','PRODUCTION','PACKING','WAREHOUSE_READY','HOLD'];
            if(!di || !allowed.includes(newStatus)) return false;
            const oldStatus=di.productionStatus||'WAITING_PLAN';
            if(newStatus==='HOLD' && !String(holdReason||'').trim()){ alert('Hold Reason is required.'); return false; }
            di.productionStatusHistory=Array.isArray(di.productionStatusHistory)?di.productionStatusHistory:[];
            di.productionStatusHistory.unshift({
                fromStatus:oldStatus,
                toStatus:newStatus,
                statusDate:statusDate||new Date().toISOString().slice(0,10),
                note:String(note||'').trim(),
                holdReason:newStatus==='HOLD'?String(holdReason||'').trim():'',
                updatedBy:state.currentUser.id,
                updatedByName:state.currentUser.name||state.currentUser.id,
                updatedAt:new Date().toISOString()
            });
            di.productionStatus=newStatus;
            di.productionStatusUpdatedAt=statusDate||new Date().toISOString().slice(0,10);
            di.productionStatusUpdatedBy=state.currentUser.id;
            return true;
        }
        function updateProductionStatus(diId,newStatus){
            if(!canUpdateProductionStatus()){alert('Only Production / Warehouse or Admin can update production status.');return;}
            const di=(state.diRecords||[]).find(d=>d.id===diId); if(!di) return;
            const quickNote=newStatus==='HOLD'?'Quick hold from order board':'Quick status update';
            const quickReason=newStatus==='HOLD'?'Operational hold':' '; 
            if(applyProductionStatusChange(di,newStatus,new Date().toISOString().slice(0,10),quickNote,quickReason)) renderView();
        }
        function renderProductionStatusHistory(di){
            const history=Array.isArray(di?.productionStatusHistory)?di.productionStatusHistory:[];
            if(!history.length) return `<div class="text-xs text-slate-400 py-3">No status history yet.</div>`;
            return `<div class="space-y-2 max-h-56 overflow-auto">${history.map(h=>`<div class="rounded-lg border border-slate-200 p-3 bg-slate-50"><div class="flex justify-between gap-3"><div class="text-xs font-black text-slate-800">${productionStatusMeta(h.fromStatus).label} → ${productionStatusMeta(h.toStatus).label}</div><div class="text-[10px] text-slate-400">${h.statusDate||'-'}</div></div><div class="text-[10px] text-slate-500 mt-1">Updated by ${h.updatedByName||h.updatedBy||'-'}</div>${h.note?`<div class="text-xs text-slate-600 mt-1">${h.note}</div>`:''}${h.holdReason?`<div class="text-xs text-rose-600 mt-1"><strong>Hold Reason:</strong> ${h.holdReason}</div>`:''}</div>`).join('')}</div>`;

t-black">Save Status</button></div></div>`);

        function renderProductionOrderAction(di){const st=di.productionStatus||'WAITING_PLAN';let next=null;if(st==='WAITING_PLAN')next=['PRODUCTION','Start Production'];else if(st==='PRODUCTION')next=['PACKING','Start Packing'];else if(st==='PACKING')next=['WAREHOUSE_READY','Warehouse Ready'];else if(st==='HOLD')next=['WAITING_PLAN','Release Hold'];const a=next?`<button onclick="updateProductionStatus('${di.id}','${next[0]}')" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-[10px] font-black">${next[1]}</button>`:'';const edit=`<button onclick="openProductionStatusModal('${di.id}')" class="px-2 py-1.5 rounded-lg border border-slate-300 text-slate-700 text-[10px] font-black">Update Status</button>`;return `<div class="flex justify-end gap-1 flex-wrap">${a}${edit}</div>`;}
        function renderProductionOrders(container){const rows=getProductionOrderRows();container.innerHTML=`<div class="space-y-5"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3"><div><div class="text-[10px] font-black uppercase tracking-wider text-blue-600">Production / Warehouse</div><h2 class="text-xl font-black text-slate-900">Production Orders</h2><p class="text-xs text-slate-500 mt-1">Orders prepared by Export from DI. View plan and update execution status with notes/history.</p></div><button onclick="changeView('calendar')" class="px-3 py-2 rounded-lg border border-blue-200 text-blue-700 text-xs font-black bg-blue-50">Open Loading Calendar</button></div><div class="bg-white rounded-xl border border-slate-200 overflow-hidden"><div class="overflow-x-auto"><table class="ui-table min-w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr><th class="p-3 text-left">DI / PO</th><th class="p-3 text-left">Customer</th><th class="p-3 text-left">Product</th><th class="p-3 text-right">Planned Qty</th><th class="p-3 text-left">Packaging</th><th class="p-3 text-left">Target Loading</th><th class="p-3 text-center">Status</th><th class="p-3 text-right">Action</th></tr></thead><tbody class="divide-y divide-slate-100">${rows.map(r=>`<tr><td class="p-3"><div class="font-black">${r.di.diNo}</div><div class="text-[9px] text-slate-400">${r.po.customerPoNo||r.po.id||'-'}</div></td><td class="p-3 font-bold">${r.customer.name||r.customer.companyName||'-'}</td><td class="p-3 font-bold">${r.product.shortName||r.product.name||'-'}</td><td class="p-3 text-right font-black">${r.qtyMt.toFixed(1)} MT</td><td class="p-3">${r.di.packaging||'-'}</td><td class="p-3 font-bold">${r.targetLoadingDate}</td><td class="p-3 text-center">${productionStatusBadge(r.status)}</td><td class="p-3 text-right">${renderProductionOrderAction(r.di)}</td></tr>`).join('')}</tbody></table></div></div><div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs text-slate-600"><strong>Scope:</strong> View DI order plan, update Production / Packing / Warehouse status, add notes/history, and view Loading Calendar. No DI or logistics editing.</div></div>`;lucide.createIcons();}

        function getAdminDashboardData() {
            const users = state.users || [];
            const customers = getScopedCustomers();
            const products = state.products || [];
            const providers = state.logisticsProviders || [];
            const pos = state.pos || [];
            const dis = state.diRecords || [];
            const activeUsers = users.filter(u => u.status !== 'INACTIVE');
            const inactiveUsers = users.filter(u => u.status === 'INACTIVE');
            const activeProducts = products.filter(p => p.status !== 'INACTIVE');
            const activeProviders = providers.filter(p => p.status !== 'INACTIVE');
            const pendingPrice = (state.specialPrices || []).filter(x => x.approvalStatus === 'PENDING').length;
            const pendingPO = pos.filter(p => p.commercialApprovalStatus === 'NEEDS_APPROVAL').length;
            const pendingCommissionRate = (state.commissionRateChangeRequests || []).filter(x => x.status === 'PENDING').length;
            const payableCommission = typeof getCommissionRows === 'function' ? getCommissionRows().filter(r => r.status === 'PAYABLE').length : 0;
            const openApprovalItems = pendingPrice + pendingPO + pendingCommissionRate + payableCommission;

            const activeStdProductIds = new Set((state.standardPrices || []).filter(p => p.status === 'ACTIVE').map(p => p.productId));
            const customerNoOwner = customers.filter(c => !c.ownerId || !users.some(u => u.id === c.ownerId)).length;
            const productNoSpec = activeProducts.filter(p => [p.starchMin, p.moistureMax, p.sandSilicaMax].every(v => v === null || v === undefined || v === '')).length;
            const productNoActivePrice = activeProducts.filter(p => !activeStdProductIds.has(p.id)).length;
            const providerNoContact = activeProviders.filter(p => !(p.contactPerson || p.phone || p.email)).length;
            const poNoDeliveryPeriod = pos.filter(p => p.poStatus !== 'CANCELLED' && (!p.deliveryStart || !p.deliveryEnd)).length;
            const diNoWcat = dis.filter(d => d.status !== 'CANCELLED' && !d.wcatNo).length;
            const loadedContainerGaps = (state.loadingEvents || []).filter(e => e.status === 'LOADED').filter(e => {
                const captured = (state.containerDetails || []).filter(c => c.loadingEventId === e.id).length;
                return captured < Number(e.actualContainers || 0);
            }).length;
            const userScopeIssues = activeUsers.filter(u => !u.role || !u.customerScope).length;
            const inactiveOwnerIds = new Set(inactiveUsers.map(u => u.id));
            const inactiveOwnerCustomers = customers.filter(c => inactiveOwnerIds.has(c.ownerId)).length;
            const externalWithoutCustomers = activeUsers.filter(u => u.role === 'EXTERNAL_SALES').filter(u => !customers.some(c => c.ownerId === u.id)).length;
            const usedProviderIds = new Set([
                ...(state.truckBookings || []).map(x => x.providerId),
                ...(state.forwarderAssignments || []).map(x => x.providerId),
                ...(state.surveyAssignments || []).map(x => x.providerId)
            ].filter(Boolean));
            const inactiveUsedProviders = providers.filter(p => p.status === 'INACTIVE' && usedProviderIds.has(p.id)).length;

            const health = [
                { key:'CUSTOMER_OWNER', label:'Customer without valid Owner', count:customerNoOwner, view:'customers', icon:'user-x' },
                { key:'PRODUCT_SPEC', label:'Active Product without Standard Spec', count:productNoSpec, view:'products', icon:'package-x' },
                { key:'PRODUCT_PRICE', label:'Active Product without Active Standard Price', count:productNoActivePrice, view:'pricing', icon:'badge-dollar-sign' },
                { key:'PARTNER_CONTACT', label:'Logistics Partner without Contact', count:providerNoContact, view:'logistics_partners', icon:'contact-round' },
                { key:'PO_PERIOD', label:'PO without Delivery Period', count:poNoDeliveryPeriod, view:'po_engine', icon:'calendar-x' },
                { key:'DI_WCAT', label:'DI without WCAT / Invoice', count:diNoWcat, view:'shipping', icon:'file-warning' },
                { key:'CONTAINER_DETAIL', label:'Loaded Event missing Container Detail', count:loadedContainerGaps, view:'shipping', icon:'container' },
                { key:'USER_SCOPE', label:'Active User missing Role / Scope', count:userScopeIssues, view:'users', icon:'shield-alert' }
            ];
            const attention = [
                { label:'Inactive user still owns Customer', count:inactiveOwnerCustomers, view:'customers', icon:'user-minus' },
                { label:'External Sales without Customer mapping', count:externalWithoutCustomers, view:'users', icon:'users-round' },
                { label:'Product in use without Active Price', count:productNoActivePrice, view:'pricing', icon:'circle-dollar-sign' },
                { label:'Inactive Partner still referenced in Shipment', count:inactiveUsedProviders, view:'logistics_partners', icon:'building-2' }
            ];
            return { users, customers, products, providers, pos, dis, activeUsers, inactiveUsers, activeProducts, activeProviders, openApprovalItems, health, attention };
        }

        async function saveNewExternalSales() {
            if (!canManageExternalSales()) { alert('Only Manager or Admin can add External Sales.'); return; }
            const fullName = document.getElementById('externalSalesNewName')?.value.trim() || '';
            const email = document.getElementById('externalSalesNewEmail')?.value.trim() || '';
            const status = document.getElementById('externalSalesNewStatus')?.value || 'ACTIVE';
            const assignedCustomerIds = Array.from(document.querySelectorAll('.external-sales-new-customer:checked')).map(x => x.value);
            const errorEl = document.getElementById('externalSalesNewError');
            const fail = msg => { if (errorEl) { errorEl.textContent = msg; errorEl.classList.remove('hidden'); } };
            if (!fullName || !email) return fail('Name and Email are required.');
            
            const btn = document.getElementById('externalSalesCreateButton');
            if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }

            try {
                const res = await fetch('/api/external-sales', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                        name: fullName,
                        email,
                        status,
                        customerIds: assignedCustomerIds
                    })

                if (btn) { btn.disabled = false; btn.textContent = 'Create External Sales'; }
                
                const body = await res.json();

                const data = body.data || {};
                const newUser = data.externalSales || {};
                
                await loadCustomersFromApi();
                await loadExternalSalesFromApi();
                await loadCustomerOwnersFromApi();
                
                openModal(`

        async function saveExternalSalesProfile(userId) {
            if (!canManageExternalSales()) { alert('Only Manager or Admin can edit External Sales.'); return; }
            const user = (state.externalSales || []).find(u => u.id === userId);
            if (!user) return;
            const fullName = document.getElementById('externalSalesName')?.value.trim() || '';
            const email = document.getElementById('externalSalesEmail')?.value.trim() || '';
            const status = document.getElementById('externalSalesStatus')?.value || 'ACTIVE';
            const assignedCustomerIds = Array.from(document.querySelectorAll('.external-sales-customer:checked')).map(x => x.value);
            const errorEl = document.getElementById('externalSalesSaveError');
            const fail = msg => { if (errorEl) { errorEl.textContent = msg; errorEl.classList.remove('hidden'); } };
            if (!fullName || !email) return fail('Name and Email are required.');
            
            const btn = document.getElementById('externalSalesSaveButton');
            if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

            try {
                const res = await fetch(`/api/external-sales/${userId}`, {
                    method: 'PUT',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                        name: fullName,
                        email,
                        status,
                        customerIds: assignedCustomerIds
                    })
                });

                if (btn) { btn.disabled = false; btn.textContent = 'Save External Sales'; }

                const body = await res.json();
                if (!res.ok || body.status !== 'SUCCESS') {

ting?.id || ''}')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">Save User</button></div></div>`);

        async function saveUser(userId = '') {
            if (!canManageUsers()) { alert('Only Admin can manage users.'); return; }
            const name=document.getElementById('userName')?.value.trim();
            const email=document.getElementById('userEmail')?.value.trim();
            const role=document.getElementById('userRole')?.value;
            const status=document.getElementById('userStatus')?.value || 'ACTIVE';

            if (duplicate) { alert('This email is already used by another user.'); return; }

            const customerScope=userScopeForRole(role);
            const saveBtn = document.querySelector('#modalContainer button[onclick^="saveUser"]');
            if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }

            try {
                if (userId) {
                    const response = await fetch(`/api/users/${userId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, role, status, customerScope })
                    });
                    const res = await response.json().catch(() => null);
                    if (!response.ok || res?.status !== 'SUCCESS') {
                        alert(res?.message || 'Unable to update user.');
                        return;
                    }
                    await loadUsersFromApi();
                    closeModal();
                    renderUsers(document.getElementById('mainContent'));
                } else {
                    const response = await fetch('/api/users', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, role, status, customerScope })
                    });
                    const res = await response.json().catch(() => null);
                    if (!response.ok || res?.status !== 'SUCCESS') {
                        alert(res?.message || 'Unable to create user.');
                        return;
                    }
                    const data = res.data || {};
                    await loadUsersFromApi();
                    showTemporaryPasswordResult({
                        title: 'Account Created',
                        name,
                        email: data.user?.email || email,
                        temporaryPassword: data.temporaryPassword || ''
                    });
                }
            } catch (err) {
                alert('Connection error: ' + err.message);
            } finally {
                if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save User'; }
            }
        }

        function fallbackCopyText_(text) {
            const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';

            try { document.execCommand('copy'); alert('Login information copied.'); } catch(e) { alert(text); }

        function getCustomerPOActualQty(po) {
            const poDIs = (state.diRecords || []).filter(di => di.poId === po.id && di.status !== 'CANCELLED');
            if (poDIs.length > 0) {
                return poDIs.reduce((sum, di) => sum + calculateDIActualQty(di), 0);
            }
            return (state.shipments || [])
                .filter(s => s.poId === po.id)
                .reduce((sum, s) => sum + (parseFloat(s.plannedTotalMt) || 0), 0);
        }

        function getCustomerProductBreakdown(customerId, year = 2026) {
            const customerPOs = (state.pos || []).filter(po => po.customerId === customerId && (!year || String(po.poDate || '').startsWith(String(year))));
            const groups = {};
            customerPOs.forEach(po => {
                const product = (state.products || []).find(p => p.id === po.productId);
                if (!groups[po.productId]) {
                    groups[po.productId] = {
                        productId: po.productId,
                        productName: product ? (product.shortName || product.name) : po.productId,
                        contractQty: 0,
                        shippedQty: 0,
                        openPO: 0,
                        poCount: 0
                    };
                }
                const contractQty = parseFloat(po.contractQtyMt) || 0;
                const shippedQty = getCustomerPOActualQty(po);
                groups[po.productId].contractQty += contractQty;
                groups[po.productId].shippedQty += shippedQty;
                groups[po.productId].poCount += 1;
                if (Math.max(0, contractQty - shippedQty) > 0 && po.poStatus !== 'CANCELLED') groups[po.productId].openPO += 1;
            });
            return Object.values(groups)
                .map(g => ({ ...g, remainingQty: Math.max(0, g.contractQty - g.shippedQty) }))
                .sort((a,b) => b.contractQty - a.contractQty);
        }

            const yearPOs = customerPOs.filter(po => !po.poDate || po.poDate.startsWith(String(year)));
            const customerDI = (state.diRecords || []).filter(di => {
                const po = customerPOs.find(p => p.id === di.poId);

                const contractMt = parseFloat(po.contractQtyMt) || 0;
                const tolerancePct = po.tolerancePct != null ? parseFloat(po.tolerancePct) : 5;
                const minAcceptableMt = contractMt * (1 - (tolerancePct / 100));
                const remainingMt = Math.max(0, contractMt - shippedMt);
                const matchedProduct = (state.products || []).find(p => p.id === po.productId);
                const poDIs = customerDI.filter(di => di.poId === po.id && di.status !== 'CANCELLED');
                let statusBadge = '';
                if (shippedMt >= minAcceptableMt && contractMt > 0) statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">COMPLETED</span>';

                else statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">PENDING</span>';
                return {
                    ...po,
                    productName: matchedProduct ? matchedProduct.shortName || matchedProduct.name : po.productId,
                    contractMt, shippedMt, remainingMt, diCount: poDIs.length, statusBadge
                };

            const productBreakdown = getCustomerProductBreakdown(c.id, year);
            const totalContractQty = productBreakdown.reduce((sum, x) => sum + x.contractQty, 0);
            const totalShippedQty = productBreakdown.reduce((sum, x) => sum + x.shippedQty, 0);
            const totalRemainingQty = Math.max(0, totalContractQty - totalShippedQty);

            const selectedProductId = state.customerProductFilter || null;

                            <i data-lucide="edit-3" class="w-4 h-4"></i><span>แก้ไขโปรไฟล์ลูกค้า</span>

                            </div>
                            ${['ADMIN', 'MANAGER', 'SALES_SUPPORT'].includes(state.currentUser.role) ? `

                        </div>
                        ${state.currentCustomerSpecs && state.currentCustomerSpecs.length > 0 ? `

                                    <tr>

                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    ${state.currentCustomerSpecs.map(spec => {
                                        const p = (state.products || []).find(x => x.id === spec.productId) || {};
                                        return `
                                            <tr class="hover:bg-slate-50">
                                                <td class="p-3">
                                                    <span class="font-bold text-slate-900">${p.code || spec.productId}</span>
                                                    <div class="text-[10px] text-slate-500">${p.name || ''} (${spec.application})</div>
                                                </td>
                                                <td class="p-3 font-mono text-[11px] text-slate-600">${spec.baseStandardSpecId}</td>
                                                <td class="p-3 text-center font-semibold">Rev.${spec.revisionNo}</td>
                                                <td class="p-3 text-center">
                                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                                                        spec.status === 'ACTIVE' ? 'bg-emerald-100 text-emerald-800' :
                                                        spec.status === 'DRAFT' ? 'bg-amber-100 text-amber-800' :
                                                        'bg-slate-100 text-slate-600'
                                                    }">${spec.status}</span>

                                                <td class="p-3 text-right">

                                                </td>

                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        ` : `
                            <div class="p-8 text-center text-slate-400 text-xs">ยังไม่มีข้อมูลสเปกเฉพาะรายลูกค้านี้</div>
                        `}
                    </div>

                    <!-- Product Breakdown -->
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                            <div><h3 class="text-sm font-black text-slate-900">Product Breakdown</h3><p class="text-[11px] text-slate-500">แยกยอด Contract / Shipped / Remaining ตามชนิดสินค้า</p></div>
                            ${selectedProductId ? `<button onclick="filterCustomerPOByProduct('${c.id}', null)" class="text-xs font-bold text-blue-600 hover:underline">Clear Product Filter</button>` : ''}
                        </div>
                        ${productBreakdown.length ? `<table class="ui-table w-full text-left text-xs">
                            <thead class="bg-slate-100 text-[10px] uppercase text-slate-500"><tr><th class="p-3">Product</th><th class="p-3 text-right">Contract Qty</th><th class="p-3 text-right">Shipped</th><th class="p-3 text-right">Remaining</th><th class="p-3 text-center">Open PO</th><th class="p-3 text-right">Action</th></tr></thead>

                        </table>` : `<div class="p-8 text-center text-slate-400 text-xs">ยังไม่มีข้อมูลสินค้าใน PO ปี ${year}</div>`}

                            <span class="text-xs text-slate-500 font-medium">${enrichedPOs.length} PO</span>
                        </div>
                        ${enrichedPOs.length === 0 ? `<div class="p-8 text-center text-slate-400 text-xs">ไม่พบ PO ตามเงื่อนไขที่เลือก</div>` : `<div class="overflow-x-auto"><table class="ui-table w-full text-left text-xs min-w-[900px]">
                            <thead class="bg-slate-100 text-slate-600 uppercase text-[10px] font-bold"><tr><th class="p-3">PO / Date</th><th class="p-3">Product</th><th class="p-3 text-right">Contract</th><th class="p-3 text-right">Actual Shipped</th><th class="p-3 text-right">Remaining</th><th class="p-3 text-center">DI</th><th class="p-3 text-center">Status</th><th class="p-3 text-right">Action</th></tr></thead>
                            <tbody class="divide-y divide-slate-200">${enrichedPOs.map(po => `<tr class="hover:bg-blue-50/40"><td class="p-3"><button onclick="goToPODetail('${po.id}')" class="font-bold text-blue-600 hover:underline">${po.customerPoNo || po.id}</button><div class="text-[9px] text-slate-400">${po.poDate || '-'} · ${po.incoterm || 'FOB'}</div></td><td class="p-3 font-bold text-slate-800">${po.productName}</td><td class="p-3 text-right font-bold">${formatMT(po.contractMt)}</td><td class="p-3 text-right font-bold text-emerald-600">${formatMT(po.shippedMt)}</td><td class="p-3 text-right font-bold ${po.remainingMt > 0 ? 'text-amber-600' : 'text-slate-400'}">${formatMT(po.remainingMt)}</td><td class="p-3 text-center"><span class="px-2 py-1 rounded bg-blue-50 text-blue-700 font-bold">${po.diCount} DI</span></td><td class="p-3 text-center">${po.statusBadge}</td><td class="p-3 text-right"><button onclick="goToPODetail('${po.id}')" class="text-blue-600 font-bold hover:underline">PO Detail →</button></td></tr>`).join('')}</tbody>
                        </table></div>`}
                    </div>

                    <!-- Customer Profile / Contacts / Logistics / CRM -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                        <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4">
                            <div class="font-bold text-slate-900 border-b pb-2 flex items-center gap-2"><i data-lucide="users" class="w-4 h-4 text-blue-600"></i>Contacts (${contactList.length})</div>
                            <div class="space-y-3">${contactList.map(contact => `<div class="p-3 rounded-lg border ${contact.isPrimary ? 'bg-blue-50/40 border-blue-200' : 'bg-slate-50 border-slate-200'}"><div class="flex justify-between gap-2"><div class="font-bold text-slate-900">${contact.name || '-'}</div>${contact.isPrimary ? '<span class="bg-blue-600 text-white text-[9px] px-1.5 py-0.5 rounded font-bold">PRIMARY</span>' : ''}</div><div class="text-[10px] text-slate-500 mt-0.5">${contact.position || '-'}</div><div class="mt-2 text-[11px] text-slate-600">${contact.email || '-'} · ${contact.phone || '-'}</div></div>`).join('')}</div>
                            <div class="pt-2 border-t"><div class="text-slate-400">Tax ID</div><div class="font-mono font-bold text-slate-800">${c.taxId || '-'}</div><div class="text-slate-400 mt-2">Billing Address</div><div class="mt-1 bg-slate-50 p-2.5 rounded border">${c.billingAddress || '-'}</div></div>
                        </div>

                        <div class="space-y-6">
                            ${canViewCommercialFields() ? `<div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm"><div class="font-bold text-slate-900 border-b pb-2 mb-3 flex items-center gap-2"><i data-lucide="credit-card" class="w-4 h-4 text-emerald-600"></i>Commercial Profile</div><div class="space-y-2"><div><span class="text-slate-400">Payment Term:</span> <strong>${c.defaultPaymentTerm || '-'}</strong></div><div><span class="text-slate-400">Preferred Currency:</span> <strong>${c.preferredCurrency || 'USD'}</strong></div><div><span class="text-slate-400">Credit Limit:</span> <strong class="text-emerald-600">$${(c.creditLimitUsd || 0).toLocaleString()} USD</strong></div></div></div>` : ``}
                            <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm"><div class="font-bold text-slate-900 border-b pb-2 mb-3 flex items-center gap-2"><i data-lucide="ship" class="w-4 h-4 text-cyan-600"></i>Logistics / Requirement</div><div class="space-y-2"><div><span class="text-slate-400">Destination Port:</span> <strong>${c.dischargePort || '-'}</strong></div><div><span class="text-slate-400">Default Packaging:</span> <strong>${c.packagingPreference || '-'}</strong></div><div><span class="text-slate-400">Special Documents:</span> <strong>${c.specialDocReq || '-'}</strong></div></div></div>
                            <div class="bg-white rounded-xl border border-amber-200 p-5 shadow-sm"><div class="font-bold text-slate-900 border-b border-amber-100 pb-2 mb-3 flex items-center gap-2"><i data-lucide="notebook-pen" class="w-4 h-4 text-amber-600"></i>CRM Notes</div><div class="bg-amber-50/70 border border-amber-100 rounded-lg p-3 text-amber-900 leading-relaxed">${c.internalNotes || 'ไม่มีบันทึกเพิ่มเติม'}</div></div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function loadPODocuments(force = false) {
            const poIds = getScopedPOs().map(po => po.id).filter(Boolean);
            const signature = poIds.slice().sort().join('|');
            if (!force && (state.poDocumentsLoading || state.poDocumentsLoadedFor === signature)) return;
            if (typeof google === 'undefined' || !google.script?.run) return;
            const token = getStoredSessionToken();
            if (!token) return;
            state.poDocumentsLoading = true;
            google.script.run
                .withSuccessHandler(res => {
                    state.poDocumentsLoading = false;
                    if (res?.status !== 'SUCCESS') return;
                    state.poDocuments = res.data?.documents || {};
                    state.poDocumentsLoadedFor = signature;
                    if (state.currentView === 'po_engine') renderView();
                })
                .withFailureHandler(() => { state.poDocumentsLoading = false; })
                .getPODocuments(token, poIds);
        }

        function canManagePODocumentLink() {
            return ['ADMIN','SALES_SUPPORT'].includes(state.currentUser.role);
        }

        function renderPODocumentButton(po) {
            const doc = state.poDocuments?.[po.id];
            if (doc?.drive_url) {
                const edit = canManagePODocumentLink() ? `<button onclick="openPODocumentLinkModal('${po.id}')" class="text-[10px] text-violet-600 font-bold hover:underline" title="Edit PO Google Drive link">Edit Link</button>` : '';
                return `<div class="inline-flex items-center justify-center gap-2"><button onclick="openPODocumentAction('${po.id}')" class="inline-flex items-center gap-1 text-emerald-700 font-bold hover:underline" title="Open PO in Google Drive"><i data-lucide="paperclip" class="w-3.5 h-3.5"></i>Open Drive</button>${edit}</div>`;
            }
            if (state.poDocumentsLoading) return `<span class="text-slate-400">Loading...</span>`;
            if (canManagePODocumentLink()) {
                return `<button onclick="openPODocumentAction('${po.id}')" class="inline-flex items-center gap-1 text-violet-600 font-bold hover:underline" title="Add PO Google Drive link"><i data-lucide="link-2" class="w-3.5 h-3.5"></i>Add Link</button>`;
            }
            return `<span class="text-slate-400">No Link</span>`;
        }

        function openPODocumentAction(poId) {
            const doc = state.poDocuments?.[poId];
            if (doc?.drive_url) {
                window.open(doc.drive_url, '_blank', 'noopener,noreferrer');
                return;
            }
            if (!canManagePODocumentLink()) return;
            openPODocumentLinkModal(poId);
        }

        function openPODocumentLinkModal(poId) {
            if (!canManagePODocumentLink()) return alert('Only Admin or Sales Support can add/edit PO links.');
            const po = (state.pos || []).find(x => x.id === poId);
            const existing = state.poDocuments?.[poId];
            openModal(`
                <div class="space-y-4">
                    <div class="flex justify-between items-start gap-3">
                        <div><div class="text-[10px] font-black uppercase tracking-wider text-violet-600">PO Document</div><h3 class="text-lg font-black text-slate-900">${existing ? 'Edit' : 'Add'} Google Drive Link</h3><p class="text-xs text-slate-500 mt-1">${po?.customerPoNo || poId}</p></div>
                        <button onclick="closeModal()" class="text-slate-400 text-xl">&times;</button>
                    </div>
                    <label class="block text-xs font-bold text-slate-600">Google Drive Link
                        <input id="poDriveUrl" type="url" value="${existing?.drive_url || ''}" placeholder="https://drive.google.com/..." class="mt-1 ui-input font-normal">
                    </label>
                    <div id="poDriveLinkError" class="hidden rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-xs font-bold text-rose-700"></div>
                    <div class="flex justify-end gap-2"><button onclick="closeModal()" class="ui-btn ui-btn-secondary">Cancel</button><button onclick="savePODocumentLink('${poId}')" class="ui-btn ui-btn-primary">Save Link</button></div>
                </div>`);
        }

        function savePODocumentLink(poId) {
            const url = document.getElementById('poDriveUrl')?.value.trim() || '';
            const errorEl = document.getElementById('poDriveLinkError');
            const fail = msg => { if (errorEl) { errorEl.textContent = msg; errorEl.classList.remove('hidden'); } };
            if (!url) return fail('Google Drive Link is required.');
            if (!/^https:\/\/(drive|docs)\.google\.com\//i.test(url)) return fail('Please enter a valid Google Drive or Google Docs link.');
            const token = getStoredSessionToken();
            if (!token) return fail('Session expired. Please sign in again.');
            google.script.run
                .withSuccessHandler(res => {
                    if (res?.status !== 'SUCCESS') return fail(res?.message || 'Unable to save PO link.');
                    state.poDocuments[poId] = res.data?.document || null;
                    closeModal();
                    renderView();
                })
                .withFailureHandler(err => fail(err?.message || 'Unable to save PO link.'))
                .savePODocument(token, { po_id:poId, drive_url:url, file_name:'Customer PO' });
        }

        function renderPOEngine(container) {
            const selectedPo = state.selectedPoId ? getScopedPOs().find(p => p.id === state.selectedPoId) : null;

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">จัดการ PO & ปรับปรุงสัญญา (PO Engine)</h2>
                            <p class="text-xs text-slate-500">ตรวจสอบรายละเอียดสัญญา ใบสั่งซื้อ แผนการส่งมอบ และเปิด/แก้ไขสัญญา PO</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            ${selectedPo ? `
                                <button onclick="state.selectedPoId=null; renderView();" class="text-xs font-bold text-slate-600 hover:text-slate-900 bg-white px-3 py-2 rounded-lg border border-slate-200 shadow-sm flex items-center space-x-1">
                                    <i data-lucide="list" class="w-4 h-4"></i>
                                    <span>ดูรายการ PO ทั้งหมด</span>
                                </button>
                            ` : ''}
                            ${canCreatePO() ? `<button onclick="openNewPOModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center space-x-2 shadow-sm transition-colors"><i data-lucide="plus-circle" class="w-4 h-4"></i><span>สร้าง PO ใหม่ (New PO)</span></button>` : ''}
                        </div>
                    </div>

                    ${selectedPo ? renderPODetailCard(selectedPo) : renderPOListTable()}
                </div>
            `;
            lucide.createIcons();
            loadPODocuments();
        }

        function renderPODetailCard(po) {
            const customer = (state.customers || []).find(c => c.id === po.customerId);
            const product = (state.products || []).find(p => p.id === po.productId);
            const contractMt = parseFloat(po.contractQtyMt) || 0;
            const tolerancePct = po.tolerancePct != null ? parseFloat(po.tolerancePct) : 5;
            const maxAllowedMt = parseFloat(po.maxInvoiceQtyMt) || (contractMt * (1 + (tolerancePct / 100)));

            const poDIs = (state.diRecords || []).filter(di => di.poId === po.id);
            const activeDIs = poDIs.filter(di => di.status !== 'CANCELLED');
            const plannedQtyForDI = (di) => ((parseFloat(di.packageWeightKg) || 0) * (parseFloat(di.bagsPerContainer) || 0) * (parseFloat(di.plannedContainers) || 0)) / 1000;
            const actualQtyForDI = (di) => (state.loadingEvents || [])
                .filter(ev => ev.diId === di.id)
                .reduce((sum, ev) => sum + (((parseFloat(ev.actualBags) || 0) * (parseFloat(di.packageWeightKg) || 0)) / 1000), 0);

            const allocatedMt = activeDIs.reduce((sum, di) => sum + plannedQtyForDI(di), 0);
            const actualShippedMt = activeDIs.reduce((sum, di) => sum + actualQtyForDI(di), 0);
            const availableToAllocateMt = Math.max(0, contractMt - allocatedMt);
            const availableInclToleranceMt = Math.max(0, maxAllowedMt - allocatedMt);
            const remainingToShipMt = Math.max(0, contractMt - actualShippedMt);
            const allocationPct = contractMt > 0 ? Math.min(100, (allocatedMt / contractMt) * 100) : 0;
            const shippedPct = contractMt > 0 ? Math.min(100, (actualShippedMt / contractMt) * 100) : 0;

            return `
                <div class="space-y-6">
                    <!-- PO Header -->
                    <div class="bg-white rounded-xl border border-blue-200 p-6 shadow-sm">
                        <div class="flex flex-col lg:flex-row justify-between lg:items-center gap-4">
                            <div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="bg-blue-600 text-white font-mono font-black text-sm px-3 py-1.5 rounded-lg">${po.customerPoNo || po.id}</span>
                                    <span class="text-[10px] font-mono text-slate-400">${po.id}</span>
                                    <span class="px-2.5 py-1 rounded text-[10px] font-black ${po.poStatus === 'COMPLETED' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">${po.poStatus || 'IN_PROGRESS'}</span>
                                </div>

        function updatePOFilter(key, value) {
            if (!state.poFilters) state.poFilters = { search: '', customerId: 'ALL', productId: 'ALL', status: 'ALL', year: 'ALL' };

            renderView();

            state.poFilters = { search: '', customerId: 'ALL', productId: 'ALL', status: 'ALL', year: 'ALL' };

            const allPOs = getScopedPOs();
            const years = [...new Set(allPOs.map(po => String(po.poDate || '').slice(0, 4)).filter(Boolean))].sort((a, b) => b.localeCompare(a));
            const searchText = String(filters.search || '').trim().toLowerCase();

            const filteredPOs = allPOs.filter(po => {
                const customer = (state.customers || []).find(c => c.id === po.customerId);
                const product = (state.products || []).find(p => p.id === po.productId);
                const poYear = String(po.poDate || '').slice(0, 4);
                const haystack = [
                    po.id,
                    po.customerPoNo,
                    customer ? customer.name : '',
                    customer ? customer.code : '',
                    product ? product.name : '',
                    product ? product.shortName : '',
                    product ? product.code : ''
                ].join(' ').toLowerCase();

                if (searchText && !haystack.includes(searchText)) return false;
                if (filters.customerId !== 'ALL' && po.customerId !== filters.customerId) return false;
                if (filters.productId !== 'ALL' && po.productId !== filters.productId) return false;
                if (filters.status !== 'ALL' && po.poStatus !== filters.status) return false;
                if (filters.year !== 'ALL' && poYear !== filters.year) return false;
                return true;
            });

            const totalContractMt = filteredPOs.reduce((sum, po) => sum + (parseFloat(po.contractQtyMt) || 0), 0);

            return `
                <div class="space-y-3">
                    <!-- PO Filters -->

                                </select>
                            </div>

                                <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Product</label>
                                <select id="poFilterProduct" onchange="updatePOFilter('productId', this.value)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs bg-white outline-none focus:border-blue-500">

                                    ${(state.products || []).map(p => `<option value="${p.id}" ${filters.productId === p.id ? 'selected' : ''}>${p.shortName || p.name}</option>`).join('')}

                                                </td>

                                </tbody>

        // --- NEW PO MODAL ---
        function getNextPOCode() {
            const currentYear = new Date().getFullYear();
            let maxNum = 0;
            (state.pos || []).forEach(p => {
                const match = p.id && p.id.match(/PO-\d{4}-(\d+)/i);
                if (match) {
                    const num = parseInt(match[1], 10);
                    if (num > maxNum) maxNum = num;
                }
            });
            const nextNum = maxNum + 1;
            return `PO-${currentYear}-${String(nextNum).padStart(3, '0')}`;
        }

                                <div id="newPoSuggestedPrice" class="mt-1.5 text-[10px] text-slate-500">Suggested Selling Price: -</div>

                        <div class="rounded-xl border border-slate-300 bg-slate-50 p-3">

            `);
            lucide.createIcons();
            
            // Auto fill destination port from first customer default

                autoFillCustomerDefaults(state.customers[0].id);
                updateNewPOPriceSuggestion();
            }
            const deliveryStart = document.getElementById('newPoDeliveryStart');
            const deliveryEnd = document.getElementById('newPoDeliveryEnd');
            if (deliveryStart && !deliveryStart.value) deliveryStart.value = todayStr;
            if (deliveryEnd && !deliveryEnd.value) deliveryEnd.value = todayStr;
