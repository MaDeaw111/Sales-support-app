                        <div><label class="font-bold text-slate-700">Target Loading Date</label><input id="editDiTargetDate" type="date" value="${di.targetLoadingDate || ''}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Container Type</label><select id="editDiContainerType" class="w-full border rounded p-2 mt-1"><option ${di.containerType==="20'"?'selected':''}>20'</option><option ${di.containerType==="40'"?'selected':''}>40'</option><option ${di.containerType==="40'HQ"?'selected':''}>40'HQ</option></select></div>
                        <div><label class="font-bold text-slate-700">Planned Containers</label><input id="editDiPlannedCont" type="number" min="1" value="${di.plannedContainers || 1}" oninput="recalcEditDIPlanPrototype()" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Packaging</label><select id="editDiPackaging" onchange="applyEditDIPackagePreset();recalcEditDIPlanPrototype()" class="w-full border rounded p-2 mt-1"><option value="Jumbo Bag 850 kg" ${di.packageWeightKg==850?'selected':''}>Jumbo Bag 850 kg</option><option value="Jumbo Bag 950 kg" ${di.packageWeightKg==950?'selected':''}>Jumbo Bag 950 kg</option><option value="CUSTOM" ${![850,950].includes(Number(di.packageWeightKg))?'selected':''}>Custom Fixed Weight</option></select></div>
                        <div><label class="font-bold text-slate-700">Fixed Bag Weight (kg)</label><input id="editDiPackageKg" type="number" min="1" value="${di.packageWeightKg || 0}" oninput="recalcEditDIPlanPrototype()" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Bags / Container</label><input id="editDiBagsPerCont" type="number" min="1" value="${di.bagsPerContainer || 1}" oninput="recalcEditDIPlanPrototype()" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Pallets / Container</label><input id="editDiPalletsPerCont" type="number" min="0" value="${di.palletsPerContainer ?? di.bagsPerContainer ?? 0}" oninput="recalcEditDIPlanPrototype()" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">DI Qty (Auto)</label><input id="editDiPlanQty" readonly class="w-full border border-emerald-300 bg-emerald-50 rounded p-2 mt-1 font-black text-emerald-700"></div>
                        <div><label class="font-bold text-slate-700">Total Pallets (Auto)</label><input id="editDiTotalPallets" readonly class="w-full border border-blue-200 bg-blue-50 rounded p-2 mt-1 font-black text-blue-700"></div>
                    </div>
                    <div id="editDiPlanMessage" class="hidden rounded-lg border p-3 text-[11px]"></div>
                    <div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 border rounded text-xs font-bold">Cancel</button><button onclick="saveEditDIPlanPrototype('${di.id}', ${actualBags})" class="px-4 py-2 bg-amber-600 text-white rounded text-xs font-bold">Save DI Plan</button></div>
                </div>`);
            recalcEditDIPlanPrototype();
        }

        function applyEditDIPackagePreset() {
            const sel = document.getElementById('editDiPackaging')?.value;
            const input = document.getElementById('editDiPackageKg');
            if (!input) return;
            if (sel === 'Jumbo Bag 850 kg') input.value = 850;
            if (sel === 'Jumbo Bag 950 kg') input.value = 950;
        }

        function recalcEditDIPlanPrototype() {
            const kg = parseFloat(document.getElementById('editDiPackageKg')?.value) || 0;
            const bags = parseFloat(document.getElementById('editDiBagsPerCont')?.value) || 0;
            const cont = parseFloat(document.getElementById('editDiPlannedCont')?.value) || 0;
            const pallets = parseFloat(document.getElementById('editDiPalletsPerCont')?.value) || 0;
            const qty = kg * bags * cont / 1000;
            const totalPallets = pallets * cont;
            const out = document.getElementById('editDiPlanQty');
            if (out) out.value = `${qty.toFixed(3)} MT`;
            const palletOut = document.getElementById('editDiTotalPallets');
            if (palletOut) palletOut.value = totalPallets.toLocaleString();
        }

        function saveEditDIPlanPrototype(diId, existingActualBags = 0) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di) return;
            const newNo = (document.getElementById('editDiPlanNo')?.value || '').trim();
            const msg = document.getElementById('editDiPlanMessage');
            if (!newNo) { msg.className='rounded-lg border border-red-200 bg-red-50 p-3 text-[11px] text-red-700'; msg.textContent='กรุณากรอก DI No.'; return; }
            const duplicate = (state.diRecords||[]).some(x => x.id!==di.id && x.poId===di.poId && String(x.diNo||'').trim().toLowerCase()===newNo.toLowerCase());
            if (duplicate) { msg.className='rounded-lg border border-red-200 bg-red-50 p-3 text-[11px] text-red-700'; msg.textContent='DI No. นี้มีอยู่แล้วใน PO เดียวกัน'; return; }
            const kg = parseFloat(document.getElementById('editDiPackageKg')?.value) || 0;
            const bags = parseFloat(document.getElementById('editDiBagsPerCont')?.value) || 0;
            const cont = parseFloat(document.getElementById('editDiPlannedCont')?.value) || 0;
            const pallets = parseFloat(document.getElementById('editDiPalletsPerCont')?.value) || 0;
            const newQty = kg * bags * cont / 1000;
            const po = (state.pos||[]).find(p=>p.id===di.poId);
            const otherAllocated = (state.diRecords||[]).filter(x=>x.poId===di.poId && x.id!==di.id && x.status!=='CANCELLED').reduce((sum,x)=>sum+calculateDIPlannedQty(x),0);
            const maxQty = parseFloat(po?.maxInvoiceQtyMt) || ((parseFloat(po?.contractQtyMt)||0) * (1 + ((parseFloat(po?.tolerancePct)||0)/100)));
            if (otherAllocated + newQty > maxQty + 0.000001) { msg.className='rounded-lg border border-red-200 bg-red-50 p-3 text-[11px] text-red-700'; msg.textContent=`DI ใหม่ทำให้ยอดรวม ${(otherAllocated+newQty).toFixed(3)} MT เกิน Max PO ${maxQty.toFixed(3)} MT`; return; }
            const packageChanged = kg !== Number(di.packageWeightKg) || bags !== Number(di.bagsPerContainer) || pallets !== Number(di.palletsPerContainer ?? di.bagsPerContainer ?? 0) || cont !== Number(di.plannedContainers);
            if (existingActualBags > 0 && packageChanged && !confirm('DI นี้มี Actual Loading แล้ว การเปลี่ยน Package / Quantity จะเปลี่ยนน้ำหนักอ้างอิงของ Loading เดิม ต้องการดำเนินการต่อหรือไม่?')) return;
            di.diNo = newNo;
            di.targetLoadingDate = document.getElementById('editDiTargetDate')?.value || '';
            di.containerType = document.getElementById('editDiContainerType')?.value || di.containerType;
            di.plannedContainers = cont;
            di.bagsPerContainer = bags;
            di.palletsPerContainer = pallets;
            di.packageWeightKg = kg;
            const pkg = document.getElementById('editDiPackaging')?.value || '';
            di.packaging = pkg === 'CUSTOM' ? `Fixed Package ${kg} kg` : pkg;
            closeModal(); renderView();
        }

        function openAssignWCATPrototype(diId, isEdit = false) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di) return;
            const today = new Date().toISOString().split('T')[0];
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3">
                        <div><h3 class="font-bold text-slate-900">${isEdit ? 'Edit WCAT / Invoice' : 'Assign WCAT / Invoice'}</h3><p class="text-[11px] text-slate-500">${di.diNo} · 1 DI = 1 WCAT / Invoice</p></div>
                        <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                    </div>
                    <div class="rounded-lg bg-purple-50 border border-purple-200 p-3 text-[11px] text-purple-900">WCAT Number คือ Invoice Number เช่น <strong>WCAT001/2026</strong> และทีมเอกสารเป็นผู้กำหนดเลข</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div class="md:col-span-2"><label class="font-bold text-slate-700">WCAT / Invoice No. *</label><input id="protoWcatNo" value="${di.wcatNo || ''}" class="w-full border rounded p-2 mt-1 font-mono font-bold" placeholder="WCAT001/2026"></div>
                        <div><label class="font-bold text-slate-700">Assigned Date</label><input id="protoWcatDate" type="date" value="${di.wcatAssignedDate || today}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Assigned By</label><input id="protoWcatBy" value="${di.wcatAssignedBy || 'Export Documentation'}" class="w-full border rounded p-2 mt-1"></div>
                    </div>
                    <div id="protoWcatMessage" class="hidden rounded-lg border p-3 text-[11px]"></div>
                    <div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 border rounded text-xs font-bold">Cancel</button><button onclick="saveWCATPrototype('${di.id}')" class="px-4 py-2 bg-purple-600 text-white rounded text-xs font-bold">${isEdit ? 'Save WCAT Change' : 'Save WCAT'}</button></div>
                </div>`);
        }

        function openEditWCATPrototype(diId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di?.wcatNo) return openAssignWCATPrototype(diId, false);
            const hasDownstream = !!di.booking || getDILoadingEvents(diId).length > 0;
            if (hasDownstream && !confirm(`WCAT ${di.wcatNo} ถูกใช้กับ Booking/Loading แล้ว ต้องการแก้ไขเลขอ้างอิงนี้หรือไม่?`)) return;
            openAssignWCATPrototype(diId, true);
        }

        function saveWCATPrototype(diId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di) return;
            const no = (document.getElementById('protoWcatNo')?.value || '').trim();
            const msg = document.getElementById('protoWcatMessage');
            if (!no) {
                msg.className = 'rounded-lg border border-red-200 bg-red-50 p-3 text-[11px] text-red-700';
                msg.textContent = 'กรุณากรอก WCAT / Invoice No.';
                return;
            }
            const duplicate = (state.diRecords || []).some(x => x.id !== di.id && (x.wcatNo || '').trim().toLowerCase() === no.toLowerCase());
            if (duplicate) {
                msg.className = 'rounded-lg border border-red-200 bg-red-50 p-3 text-[11px] text-red-700';
                msg.textContent = 'WCAT / Invoice No. นี้ถูกใช้กับ DI อื่นแล้ว';
                return;
            }
            di.wcatNo = no;
            di.wcatAssignedDate = document.getElementById('protoWcatDate')?.value || '';
            di.wcatAssignedBy = document.getElementById('protoWcatBy')?.value || '';
            if (di.status === 'PLANNED') di.status = 'WCAT_ASSIGNED';
            closeModal();
            renderView();
        }

        function openBookingPrototype(diId, isRevision = false) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di || !di.wcatNo) return;
            const po = (state.pos || []).find(p => p.id === di.poId);
            const b = di.booking || {};
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3">
                        <div><h3 class="font-bold text-slate-900">${isRevision ? 'Revise Booking' : (di.booking ? 'Update Booking' : 'Add Booking')}</h3><p class="text-[11px] text-slate-500">${di.diNo} · ${di.wcatNo}</p></div>
                        <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div><label class="font-bold text-slate-700">Booking No. *</label><input id="protoBookingNo" value="${b.bookingNo || ''}" class="w-full border rounded p-2 mt-1 font-mono"></div>
                        <div><label class="font-bold text-slate-700">Shipping Line</label><input id="protoBookingCarrier" value="${b.carrier || ''}" class="w-full border rounded p-2 mt-1" placeholder="MSC / ONE / COSCO"></div>
                        <div class="md:col-span-2"><label class="font-bold text-slate-700">Vessel / Voyage</label><input id="protoBookingVessel" value="${b.vesselVoyage || ''}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Port of Loading</label><input id="protoBookingPOL" value="${b.pol || 'Laem Chabang'}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Port of Discharge</label><input id="protoBookingPOD" value="${b.pod || po?.destinationPort || ''}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">ETD</label><input id="protoBookingETD" type="date" value="${b.etd || ''}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">ETA</label><input id="protoBookingETA" type="date" value="${b.eta || ''}" class="w-full border rounded p-2 mt-1"></div>
                        <div class="md:col-span-2"><label class="font-bold text-slate-700">Revision Note</label><textarea id="protoBookingNote" rows="2" class="w-full border rounded p-2 mt-1" placeholder="เหตุผลที่ revise / หมายเหตุ">${isRevision ? '' : (b.revisionNote || '')}</textarea></div>
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-slate-500"><span>Status: <strong>${b.status || 'NEW'}</strong></span><span>Revision: <strong>${b.revisionNo || 'Rev.0'}</strong></span></div>
                    <div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 border rounded text-xs font-bold">Cancel</button><button onclick="saveBookingPrototype('${di.id}', ${isRevision})" class="px-4 py-2 bg-blue-600 text-white rounded text-xs font-bold">${isRevision ? 'Save Revision' : 'Save Booking'}</button></div>
                </div>`);
        }

        function saveBookingPrototype(diId, isRevision) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di) return;
            const bookingNo = (document.getElementById('protoBookingNo')?.value || '').trim();
            if (!bookingNo) { alert('กรุณากรอก Booking No.'); return; }
            const old = di.booking || {};
            let rev = old.revisionNo || 'Rev.0';
            if (isRevision) {
                const n = parseInt(String(rev).replace(/\D/g,''),10) || 0;
                rev = `Rev.${n+1}`;
            }
            di.booking = {
                bookingNo,
                carrier: document.getElementById('protoBookingCarrier')?.value || '',
                vesselVoyage: document.getElementById('protoBookingVessel')?.value || '',
                pol: document.getElementById('protoBookingPOL')?.value || '',
                pod: document.getElementById('protoBookingPOD')?.value || '',
                etd: document.getElementById('protoBookingETD')?.value || '',
                eta: document.getElementById('protoBookingETA')?.value || '',
                revisionNo: rev,
                revisionNote: document.getElementById('protoBookingNote')?.value || '',
                status: isRevision ? 'REVISED' : 'ACTIVE'
            };
            di.status = 'BOOKED';
            closeModal();
            renderView();
        }

        function reviseBookingPrototype(diId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di?.booking) return openBookingPrototype(diId, false);
            openBookingPrototype(diId, true);
        }

        function cancelBookingPrototype(diId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di?.booking) return;
            const reason = prompt('เหตุผลการ Cancel Booking (optional):', di.booking.cancelReason || '') || '';
            di.booking.status = 'CANCELLED';
            di.booking.cancelReason = reason;
            di.status = 'WCAT_ASSIGNED';
            renderView();
        }

        function getNextLoadingEventId() {
            let max = 0;
            (state.loadingEvents || []).forEach(e => {
                const m = String(e.id || '').match(/LOAD-(\d+)/i);
                if (m) max = Math.max(max, parseInt(m[1],10));
            });
            return `LOAD-${String(max+1).padStart(3,'0')}`;
        }

        function openLoadingEventPrototype(diId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            if (!di) return;
            const today = new Date().toISOString().split('T')[0];
            const existing = getDILoadingEvents(diId);
            const nextSeq = existing.length ? Math.max(...existing.map(e=>Number(e.sequenceNo)||0))+1 : 1;
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3"><div><h3 class="font-bold text-slate-900">Add Loading Event</h3><p class="text-[11px] text-slate-500">${di.diNo} · Loading ได้หลายวัน</p></div><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div><label class="font-bold text-slate-700">Loading Date *</label><input id="protoLoadDate" type="date" value="${today}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Sequence No.</label><input id="protoLoadSequence" type="number" min="1" value="${nextSeq}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Planned Containers</label><input id="protoLoadPlannedCont" type="number" min="0" value="1" oninput="recalcLoadingEventPrototype('${di.id}')" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Actual Containers</label><input id="protoLoadActualCont" type="number" min="0" value="0" oninput="recalcLoadingEventPrototype('${di.id}')" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Actual Bags</label><input id="protoLoadActualBags" type="number" min="0" value="0" oninput="recalcLoadingEventPrototype('${di.id}')" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Status</label><select id="protoLoadStatus" class="w-full border rounded p-2 mt-1"><option>PLANNED</option><option>READY</option><option>LOADING</option><option>LOADED</option><option>CANCELLED</option></select></div>
                        <div class="md:col-span-2"><label class="font-bold text-slate-700">Actual Qty (Auto)</label><input id="protoLoadQty" readonly class="w-full border border-emerald-300 bg-emerald-50 rounded p-2 mt-1 font-black text-emerald-700" value="0.000 MT"></div>
                    </div>
                    <div class="rounded-lg bg-emerald-50 border border-emerald-200 p-3 text-[11px] text-emerald-900">Fixed weight: Actual Qty = Actual Bags × ${di.packageWeightKg} kg ÷ 1,000</div>
                    <div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 border rounded text-xs font-bold">Cancel</button><button onclick="saveLoadingEventPrototype('${di.id}')" class="px-4 py-2 bg-emerald-600 text-white rounded text-xs font-bold">Save Loading Event</button></div>
                </div>`);
        }

        function openEditLoadingEventPrototype(diId, eventId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            const event = (state.loadingEvents || []).find(e => e.id === eventId && e.diId === diId);
            if (!di || !event) return;
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3"><div><h3 class="font-bold text-slate-900">Edit Loading Event</h3><p class="text-[11px] text-slate-500">${di.diNo} · ${event.loadingDate} · Seq ${event.sequenceNo}</p></div><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div><label class="font-bold text-slate-700">Loading Date *</label><input id="protoLoadDate" type="date" value="${event.loadingDate || ''}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Sequence No.</label><input id="protoLoadSequence" type="number" min="1" value="${event.sequenceNo || 1}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Planned Containers</label><input id="protoLoadPlannedCont" type="number" min="0" value="${event.plannedContainers || 0}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Actual Containers</label><input id="protoLoadActualCont" type="number" min="0" value="${event.actualContainers || 0}" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Actual Bags</label><input id="protoLoadActualBags" type="number" min="0" value="${event.actualBags || 0}" oninput="recalcLoadingEventPrototype('${di.id}')" class="w-full border rounded p-2 mt-1"></div>
                        <div><label class="font-bold text-slate-700">Status</label><select id="protoLoadStatus" class="w-full border rounded p-2 mt-1">${['PLANNED','READY','LOADING','LOADED','CANCELLED'].map(x=>`<option ${x===event.status?'selected':''}>${x}</option>`).join('')}</select></div>
                        <div class="md:col-span-2"><label class="font-bold text-slate-700">Actual Qty (Auto)</label><input id="protoLoadQty" readonly class="w-full border border-emerald-300 bg-emerald-50 rounded p-2 mt-1 font-black text-emerald-700" value="${(((event.actualBags||0)*di.packageWeightKg)/1000).toFixed(3)} MT"></div>
                    </div>
                    <div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 border rounded text-xs font-bold">Cancel</button><button onclick="saveEditLoadingEventPrototype('${di.id}','${event.id}')" class="px-4 py-2 bg-amber-600 text-white rounded text-xs font-bold">Save Changes</button></div>
                </div>`);
        }

        function saveEditLoadingEventPrototype(diId, eventId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            const event = (state.loadingEvents || []).find(e => e.id === eventId && e.diId === diId);
            if (!di || !event) return;
            const date = document.getElementById('protoLoadDate')?.value || '';
            if (!date) { alert('กรุณาเลือก Loading Date'); return; }
            event.loadingDate = date;
            event.sequenceNo = parseInt(document.getElementById('protoLoadSequence')?.value,10) || 1;
            event.plannedContainers = parseInt(document.getElementById('protoLoadPlannedCont')?.value,10) || 0;
            event.actualContainers = parseInt(document.getElementById('protoLoadActualCont')?.value,10) || 0;
            event.actualBags = parseInt(document.getElementById('protoLoadActualBags')?.value,10) || 0;
            event.status = document.getElementById('protoLoadStatus')?.value || 'PLANNED';
            if (event.actualBags > 0) di.status = event.status === 'LOADED' ? 'SHIPPED' : 'LOADING';
            closeModal(); renderView();
        }

        function deleteLoadingEventPrototype(diId, eventId) {
            const event = (state.loadingEvents || []).find(e => e.id === eventId && e.diId === diId);
            if (!event) return;
            const details = (state.containerDetails || []).filter(c => c.loadingEventId === eventId);
            if (!confirm(`Delete Loading Event ${event.loadingDate} Seq ${event.sequenceNo}?${details.length ? `\nContainer details ${details.length} รายการจะถูกลบด้วย` : ''}`)) return;
            state.loadingEvents = (state.loadingEvents || []).filter(e => e.id !== eventId);
            state.containerDetails = (state.containerDetails || []).filter(c => c.loadingEventId !== eventId);
            renderView();
        }

        function recalcLoadingEventPrototype(diId) {
            const di = (state.diRecords || []).find(d => d.id === diId);
            const bags = parseFloat(document.getElementById('protoLoadActualBags')?.value) || 0;
            const qty = bags * (parseFloat(di?.packageWeightKg)||0) / 1000;
            const out = document.getElementById('protoLoadQty');
            if (out) out.value = `${qty.toFixed(3)} MT`;

        function saveLoadingEventPrototype(diId) {

        function getPOAllocationSnapshot(poId) {
            const po = (state.pos || []).find(p => p.id === poId);
            if (!po) return { contractMt: 0, maxAllowedMt: 0, allocatedMt: 0, availableMt: 0, availableInclToleranceMt: 0 };
            const contractMt = parseFloat(po.contractQtyMt) || 0;
            const tolerancePct = po.tolerancePct != null ? parseFloat(po.tolerancePct) : 5;
            const maxAllowedMt = parseFloat(po.maxInvoiceQtyMt) || (contractMt * (1 + tolerancePct / 100));
            const allocatedMt = (state.diRecords || [])
                .filter(di => di.poId === poId && di.status !== 'CANCELLED')
                .reduce((sum, di) => sum + (((parseFloat(di.packageWeightKg)||0) * (parseFloat(di.bagsPerContainer)||0) * (parseFloat(di.plannedContainers)||0)) / 1000), 0);
            return {
                contractMt,
                maxAllowedMt,
                allocatedMt,
                availableMt: Math.max(0, contractMt - allocatedMt),
                availableInclToleranceMt: Math.max(0, maxAllowedMt - allocatedMt)
            };
        }

        function refreshDIPrototypePOContext() {
            const poId = document.getElementById('protoPo')?.value;
            const po = (state.pos || []).find(p => p.id === poId);
            if (!po) return;
            const customer = (state.customers || []).find(c => c.id === po.customerId);
            const product = (state.products || []).find(p => p.id === po.productId);
            const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val ?? ''; };
            setVal('protoCustomer', customer?.name || po.customerId);
            setVal('protoProduct', product?.shortName || product?.name || po.productId);
            setVal('protoDestination', po.destinationPort || '');
            const periodHint = document.getElementById('protoDeliveryPeriodHint');
            if (periodHint) periodHint.textContent = `PO Delivery Period: ${formatDeliveryPeriod(po.deliveryStart, po.deliveryEnd)}`;

            // DI inherits shipment terms from the selected PO by default.
            setVal('protoContainerType', po.containerType || "20'");
            setVal('protoPackaging', po.packaging || '');
            setVal('protoBagKg', String(po.packageWeightKg ?? ''));
            setVal('protoBags', String(po.unitsPerContainer ?? ''));
            setVal('protoPallets', String(po.palletsPerContainer ?? po.unitsPerContainer ?? ''));

            const override = document.getElementById('protoShipmentOverride');
            if (override) override.checked = false;
            const reason = document.getElementById('protoChangeReason');
            if (reason) reason.value = '';
            const reasonWrap = document.getElementById('protoChangeReasonWrap');
            if (reasonWrap) reasonWrap.classList.add('hidden');
            setShipmentPlanFieldEditabilityPrototype(false);

            const planSummary = document.getElementById('protoPoPlanSummary');
            if (planSummary) {
                const wt = (parseFloat(po.packageWeightKg)||0) * (parseFloat(po.unitsPerContainer)||0) / 1000;
                planSummary.innerHTML = `<strong>${po.containerType || '-'}</strong> · ${po.packaging || '-'} · ${(parseFloat(po.packageWeightKg)||0).toLocaleString()} kg/unit · ${(parseFloat(po.unitsPerContainer)||0).toLocaleString()} units · <strong>${wt.toFixed(3)} MT/container</strong>`;
            }
            recalcDIPrototype();
            validateDIPrototypeForm();
        }

        function toggleShipmentOverridePrototype() {
            const overrideEnabled = Boolean(document.getElementById('protoShipmentOverride')?.checked);
            const reasonWrap = document.getElementById('protoChangeReasonWrap');
            if (reasonWrap) reasonWrap.classList.toggle('hidden', !overrideEnabled);

        function recalcDIPrototype() {
            const bagKg = parseFloat(document.getElementById('protoBagKg')?.value) || 0;
            const bags = parseFloat(document.getElementById('protoBags')?.value) || 0;
            const cont = parseFloat(document.getElementById('protoCont')?.value) || 0;
            const pallets = parseFloat(document.getElementById('protoPallets')?.value) || 0;
            const diQty = (bagKg * bags * cont) / 1000;
            const totalPallets = pallets * cont;
            const out = document.getElementById('protoQty');
            if (out) out.value = diQty.toFixed(3);
            const palletOut = document.getElementById('protoTotalPallets');
            if (palletOut) palletOut.value = totalPallets.toLocaleString();

            const poId = document.getElementById('protoPo')?.value;
            const snap = getPOAllocationSnapshot(poId);
            const afterContract = snap.availableMt - diQty;
            const afterMax = snap.availableInclToleranceMt - diQty;
            const box = document.getElementById('protoBalanceBox');
            if (box) {
                const severity = afterMax < 0 ? 'border-red-300 bg-red-50 text-red-900' : afterContract < 0 ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-blue-200 bg-blue-50 text-blue-950';
                box.className = `rounded-lg border p-3 text-xs ${severity}`;
                box.innerHTML = `
                    <div class="font-black mb-2">PO Balance Preview</div>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-1">
                        <span>Available before DI</span><strong class="text-right">${snap.availableMt.toFixed(3)} MT</strong>
                        <span>This DI</span><strong class="text-right">${diQty.toFixed(3)} MT</strong>
                        <span>Available after DI</span><strong class="text-right">${afterContract.toFixed(3)} MT</strong>
                        <span>Max incl. tolerance remaining</span><strong class="text-right">${afterMax.toFixed(3)} MT</strong>
                    </div>
                    ${afterMax < 0 ? '<div class="mt-2 font-black">⛔ Exceeds PO Maximum Quantity — Save must be blocked in production.</div>' : afterContract < 0 ? '<div class="mt-2 font-bold">⚠ Uses PO tolerance quantity.</div>' : ''}
                `;
            }
            validateDIPrototypeForm();
        }

        function getNextDIRecordId() {
            let maxNum = 0;
            (state.diRecords || []).forEach(di => {
                const match = String(di.id || '').match(/DIREC-\d{4}-(\d+)/i);
                if (match) maxNum = Math.max(maxNum, parseInt(match[1], 10) || 0);
            });
            const year = new Date().getFullYear();
            return `DIREC-${year}-${String(maxNum + 1).padStart(4, '0')}`;
        }

        function isDateOutsidePOPeriod(po, dateValue) {
            if (!po || !dateValue || !po.deliveryStart || !po.deliveryEnd) return false;
            return dateValue < po.deliveryStart || dateValue > po.deliveryEnd;
        }

        function validateDIPrototypeForm() {
            const saveBtn = document.getElementById('protoSaveDI');
            if (!saveBtn) return false;
            const poId = document.getElementById('protoPo')?.value || '';
            const diNo = String(document.getElementById('protoDiNo')?.value || '').trim();
            const diQty = parseFloat(document.getElementById('protoQty')?.value) || 0;
            const snap = getPOAllocationSnapshot(poId);
            const duplicate = (state.diRecords || []).some(di => di.poId === poId && String(di.diNo || '').trim().toLowerCase() === diNo.toLowerCase());
            const overMax = diQty > snap.availableInclToleranceMt + 0.000001;
            const overrideEnabled = Boolean(document.getElementById('protoShipmentOverride')?.checked);
            const changeReason = String(document.getElementById('protoChangeReason')?.value || '').trim();
            const missingOverrideReason = overrideEnabled && !changeReason;
            const po = (state.pos || []).find(p => p.id === poId);
            const targetLoadingDate = document.getElementById('protoLoadingDate')?.value || '';
            const outsideDeliveryPeriod = isDateOutsidePOPeriod(po, targetLoadingDate);
            const deliveryReason = String(document.getElementById('protoInstruction')?.value || '').trim();
            const missingDeliveryReason = outsideDeliveryPeriod && !deliveryReason;
            const valid = Boolean(diNo) && diQty > 0 && !duplicate && !overMax && !missingOverrideReason && !missingDeliveryReason;
            saveBtn.disabled = !valid;

            const msg = document.getElementById('protoFormMessage');
            if (msg) {
                if (duplicate && diNo) {
                    msg.className = 'rounded-lg border border-red-300 bg-red-50 p-3 text-[11px] text-red-900';
                    msg.innerHTML = '<strong>Duplicate DI Number:</strong> เลข DI นี้มีอยู่แล้วใน PO เดียวกัน กรุณาตรวจสอบก่อนบันทึก';
                } else if (overMax) {
                    msg.className = 'rounded-lg border border-red-300 bg-red-50 p-3 text-[11px] text-red-900';
                    msg.innerHTML = '<strong>Exceeds PO Maximum Quantity:</strong> DI นี้เกิน Max Qty รวม tolerance จึงไม่สามารถบันทึกได้';
                } else if (missingOverrideReason) {
                    msg.className = 'rounded-lg border border-amber-300 bg-amber-50 p-3 text-[11px] text-amber-900';
                    msg.innerHTML = '<strong>Reason Required:</strong> เมื่อ Customize Shipment Plan ต้องระบุเหตุผลที่เปลี่ยนจาก PO Shipment Plan';
                } else if (missingDeliveryReason) {
                    msg.className = 'rounded-lg border border-amber-300 bg-amber-50 p-3 text-[11px] text-amber-900';
                    msg.innerHTML = '<strong>Loading date is outside PO delivery period.</strong> กรุณาใส่เหตุผล/หมายเหตุใน Special Instruction ก่อนบันทึก';
                } else if (outsideDeliveryPeriod) {
                    msg.className = 'rounded-lg border border-amber-300 bg-amber-50 p-3 text-[11px] text-amber-900';
                    msg.innerHTML = '<strong>Loading date is outside PO delivery period.</strong> ระบบอนุญาตให้ดำเนินการต่อเพราะมีเหตุผล/หมายเหตุแล้ว';
                } else if (!diNo) {
                    msg.className = 'hidden rounded-lg border p-3 text-[11px]';
                    msg.innerHTML = '';
                } else {
                    msg.className = 'hidden rounded-lg border p-3 text-[11px]';
                    msg.innerHTML = '';
                }
            }
            return valid;
        }

        function saveDIPrototype() {
            if (!validateDIPrototypeForm()) return;
            const poId = document.getElementById('protoPo').value;
            const po = (state.pos || []).find(p => p.id === poId);
            if (!po) return;

            const bagKg = parseFloat(document.getElementById('protoBagKg').value) || 0;
            const bagsPerContainer = parseFloat(document.getElementById('protoBags').value) || 0;
            const plannedContainers = parseFloat(document.getElementById('protoCont').value) || 0;
            const palletsPerContainer = parseFloat(document.getElementById('protoPallets').value) || 0;
            const diNo = String(document.getElementById('protoDiNo').value || '').trim();
            const newDI = {
                id: getNextDIRecordId(),
                diNo,
                poId,
                wcatNo: '',
                status: 'PLANNED',
                shipmentPlanSource: 'PO',
                poShipmentPlanSnapshot: { containerType: po.containerType || '', packaging: po.packaging || '', packageWeightKg: parseFloat(po.packageWeightKg) || 0, unitsPerContainer: parseFloat(po.unitsPerContainer) || 0, totalWeightPerContainerMt: parseFloat(po.totalWeightPerContainerMt) || 0 },
                shipmentOverride: Boolean(document.getElementById('protoShipmentOverride')?.checked),
                shipmentChangeReason: String(document.getElementById('protoChangeReason')?.value || '').trim(),
                containerType: document.getElementById('protoContainerType').value,
                packaging: String(document.getElementById('protoPackaging')?.value || `Jumbo Bag ${bagKg} kg`).trim(),
                packageWeightKg: bagKg,
                bagsPerContainer,
                palletsPerContainer,
                plannedContainers,
                targetLoadingDate: document.getElementById('protoLoadingDate').value || '',

        async function saveCustomerToApi(customer, mode) {
            const url = mode === 'create' ? '/api/customers' : `/api/customers/${customer.id}`;
            const method = mode === 'create' ? 'POST' : 'PUT';
            
            const res = await fetch(url, {
                method,
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(customer)
            });
            
            const body = await res.json();
            if (body && body.status === 'ERROR') {
                throw new Error(body.message || 'API request failed');
            }
            if (!res.ok) {
                throw new Error(`HTTP Error: ${res.status}`);
            }
            if (!body || body.status !== 'SUCCESS' || !body.data || !body.data.customer) {
                throw new Error('Malformed API response');
            }
            return body.data.customer;
        }

        async function saveEditCustomer(e, id) {
            e.preventDefault();
            const c = getScopedCustomers().find(x => x.id === id);
            if (!c) return;

            const errDiv = document.getElementById('editCustomerError');
            if (errDiv) {
                errDiv.classList.add('hidden');
                errDiv.textContent = '';
            }

            const ownerId = document.getElementById('editCOwner').value || null;
            if (ownerId) {
                const owners = state.customerOwners || [];
                const ownerExists = owners.some(u => u.id === ownerId);
                if (!ownerExists) {
                    if (errDiv) {
                        errDiv.classList.remove('hidden');
                        errDiv.textContent = 'The current Owner is no longer available. Please select a valid Owner or Unassigned.';
                    }
                    return;
                }
            }

            const uiStatus = document.getElementById('editCStatus').value;
            const apiStatus = uiStatus === 'ACTIVE' ? 'ACTIVE_CUSTOMER' : 'INACTIVE_CUSTOMER';

            const contacts = (currentEditContacts || []).map(ct => ({
                id: ct.id || null,
                name: ct.name,
                position: ct.position || '',
                email: ct.email || '',
                phone: ct.phone || '',
                isPrimary: !!ct.isPrimary
            }));
            let primaryIndex = contacts.findIndex(ct => !!ct.isPrimary);
            if (primaryIndex === -1 && contacts.length > 0) {
                primaryIndex = 0;
            }
            contacts.forEach((ct, idx) => {
                ct.isPrimary = (idx === primaryIndex);
            });

            const payload = {
                id,
                code: c.code,
                name: document.getElementById('editCName').value,
                country: document.getElementById('editCCountry').value,
                source: c.source || 'DIRECT',
                ownerId,
                status: apiStatus,
                notes: document.getElementById('editCNotes').value,
                contacts
            };

            try {
                const saved = await saveCustomerToApi(payload, 'update');
                const idx = state.customers.findIndex(x => x.id === id);
                if (idx !== -1) {
                    state.customers[idx] = saved;
                }
                state.selectedCustomerId = saved.id;
                closeModal();
                renderView();
            } catch (err) {
                if (errDiv) {
                    errDiv.classList.remove('hidden');
                    errDiv.textContent = 'Save customer failed: ' + err.message;
                } else {
                    alert('Save customer failed: ' + err.message);
                }
            }
        }

        async function createStandardSpecDraft(productId, application) {
            const effectiveDate = new Date().toISOString().slice(0, 10);
            try {
                const res = await fetch('/api/standard-specs', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ productId, application, effectiveDate, notes: 'Created from frontend' })
                });
                const body = await res.json();
                if (body && body.status === 'SUCCESS') {
                    openProductDashboard(productId, application);
                } else {
                    alert('Failed to create draft: ' + body.message);
                }
            } catch (err) {
                alert('Request failed: ' + err.message);
            }
        }

            if (!confirm('ยืนยันเปิดใช้งานสเปกนี้ (จะจัดเก็บรุ่นก่อนหน้าเป็น Archived อัตโนมัติ)?')) return;
            try {
                const res = await fetch(`/api/standard-specs/${specId}/activate`, { method: 'POST' });
                const body = await res.json();
                if (body && body.status === 'SUCCESS') {
                    openProductDashboard(state.selectedProductId, state.selectedProductApp);
                } else {
                    alert('Activation failed: ' + body.message);
                }
            } catch (err) {
                alert('Request failed: ' + err.message);
            }
        }

        async function saveProduct(productId = null) {
            const errDiv = document.getElementById('productFormError');
            if (errDiv) errDiv.classList.add('hidden');

            const code = document.getElementById('prodCode')?.value || '';
            const name = document.getElementById('prodName')?.value || '';
            const shortName = document.getElementById('prodShortName')?.value || '';
            const hsCode = document.getElementById('prodHsCode')?.value || '';
            const categoryId = document.getElementById('prodCategoryId')?.value || '';
            const formId = document.getElementById('prodFormId')?.value || '';
            const defaultUnit = document.getElementById('prodDefaultUnit')?.value || 'MT';
            const status = document.getElementById('prodStatus')?.value || 'ACTIVE';

            const apps = [];
            if (document.getElementById('prodAppFeed')?.checked) apps.push('FEED_GRADE');
            if (document.getElementById('prodAppPet')?.checked) apps.push('PET_GRADE');

            if (!code || !name || !shortName || !categoryId || !formId || apps.length === 0) {
                if (errDiv) {
                    errDiv.innerText = 'กรุณากรอกข้อมูลที่จำเป็นทั้งหมด รวมถึงเลือกอย่างน้อย 1 Application';
                    errDiv.classList.remove('hidden');
                }
                return;
            }

            const payload = { code, name, shortName, hsCode, categoryId, formId, defaultUnit, status, applications: apps };
            const url = productId ? `/api/products/${productId}` : '/api/products';
            const method = productId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const body = await res.json();
                if (body && body.status === 'SUCCESS') {
                    closeModal();
                    await loadProductsFromApi();
                    if (state.currentView === 'product_dashboard' && productId) {
                        openProductDashboard(productId);
                    } else {
                        changeView('products');
                    }
                } else {
                    if (errDiv) {
                        errDiv.innerText = 'บันทึกล้มเหลว: ' + body.message;
                        errDiv.classList.remove('hidden');
                    }
                }
            } catch (err) {
                if (errDiv) {
                    errDiv.innerText = 'Error: ' + err.message;
                    errDiv.classList.remove('hidden');
                }
            }
        }

        async function saveStandardSpecItems(specId) {
            const errDiv = document.getElementById('specItemsFormError');
            if (errDiv) errDiv.classList.add('hidden');

            const payloadItems = [];
            let hasError = false;

            document.querySelectorAll('#specItemsTableBody tr').forEach(row => {
                const isChecked = row.querySelector('.param-row-checkbox').checked;
                if (isChecked) {
                    const parameterId = row.querySelector('.param-row-checkbox').dataset.paramId;
                    const operator = row.querySelector('.select-operator').value;
                    const unit = row.querySelector('.input-unit').value || '';
                    const notes = row.querySelector('.input-notes').value || '';

                    let numericValue = null;
                    let numericValueTo = null;
                    let textValue = null;

                    if (operator === 'TEXT') {
                        textValue = row.querySelector('.input-txt').value;
                        if (!textValue) {
                            hasError = true;
                            if (errDiv) errDiv.innerText = 'กรุณาระบุเกณฑ์ข้อความสำหรับพารามิเตอร์ที่เลือก';
                        }
                    } else if (operator === 'RANGE') {
                        const lowStr = row.querySelector('.input-num').value;
                        const highStr = row.querySelector('.input-num-to').value;
                        if (!lowStr || !highStr) {
                            hasError = true;
                            if (errDiv) errDiv.innerText = 'RANGE ต้องระบุทั้งขอบเขตล่างและขอบเขตบน';
                        } else {
                            numericValue = parseFloat(lowStr);
                            numericValueTo = parseFloat(highStr);
                            if (numericValueTo <= numericValue) {
                                hasError = true;
                                if (errDiv) errDiv.innerText = 'ขอบเขตบนของ RANGE ต้องมากกว่าขอบเขตล่าง';
                            }
                        }
                    } else {
                        const valStr = row.querySelector('.input-num').value;
                        if (!valStr) {
                            hasError = true;
                            if (errDiv) errDiv.innerText = 'กรุณาระบุค่าตัวเลขสำหรับเกณฑ์ที่เลือก';
                        } else {
                            numericValue = parseFloat(valStr);
                        }
                    }

                    payloadItems.push({ parameterId, operator, numericValue, numericValueTo, textValue, unit, notes });
                }
            });

            if (hasError) {
                if (errDiv) errDiv.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`/api/standard-specs/${specId}`, {
                    method: 'PUT',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ items: payloadItems })
                });
                const body = await res.json();
                if (body && body.status === 'SUCCESS') {
                    closeModal();
                    openProductDashboard(state.selectedProductId, state.selectedProductApp);
                } else {
                    if (errDiv) {
                        errDiv.innerText = 'Save items failed: ' + body.message;
                        errDiv.classList.remove('hidden');
                    }
                }
            } catch (err) {
                if (errDiv) {
                    errDiv.innerText = 'Request failed: ' + err.message;
                    errDiv.classList.remove('hidden');
                }
            }
        }

        async function saveCustomerSpecOverrides(specId, customerId) {
            const errDiv = document.getElementById('custOverridesFormError');
            if (errDiv) errDiv.classList.add('hidden');

            const overrides = [];
            let hasError = false;

            document.querySelectorAll('#custOverridesTableBody tr').forEach(row => {
                const isChecked = row.querySelector('.override-checkbox').checked;
                if (isChecked) {
                    const parameterId = row.querySelector('.override-checkbox').dataset.paramId;
                    const operator = row.querySelector('.override-operator').value;
                    const unit = row.querySelector('.override-unit').value || '';
                    const notes = row.querySelector('.override-notes').value || '';

                    let numericValue = null;
                    let numericValueTo = null;
                    let textValue = null;

                    if (operator === 'TEXT') {
                        textValue = row.querySelector('.override-txt').value;
                        if (!textValue) {
                            hasError = true;
                            if (errDiv) errDiv.innerText = 'กรุณาระบุเกณฑ์ข้อความสำหรับพารามิเตอร์ที่เลือก';
                        }
                    } else if (operator === 'RANGE') {
                        const lowStr = row.querySelector('.override-num').value;
                        const highStr = row.querySelector('.override-num-to').value;
                        if (!lowStr || !highStr) {
                            hasError = true;
                            if (errDiv) errDiv.innerText = 'RANGE ต้องระบุทั้งขอบเขตล่างและขอบเขตบน';
                        } else {
                            numericValue = parseFloat(lowStr);
                            numericValueTo = parseFloat(highStr);
                            if (numericValueTo <= numericValue) {
                                hasError = true;
                                if (errDiv) errDiv.innerText = 'ขอบเขตบนของ RANGE ต้องมากกว่าขอบเขตล่าง';
                            }
                        }
                    } else {
                        const valStr = row.querySelector('.override-num').value;
                        if (!valStr) {
                            hasError = true;
                            if (errDiv) errDiv.innerText = 'กรุณาระบุค่าตัวเลขสำหรับเกณฑ์ที่เลือก';
                        } else {
                            numericValue = parseFloat(valStr);
                        }
                    }

                    overrides.push({ parameterId, operator, numericValue, numericValueTo, textValue, unit, notes });
                }
            });

            if (hasError) {
                if (errDiv) errDiv.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`/api/customer-specs/${specId}`, {
                    method: 'PUT',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ overrides })
                });
                const body = await res.json();
                if (body && body.status === 'SUCCESS') {
                    closeModal();
                    await loadCustomerSpecsForCustomer(customerId);
                    viewCustomerSpecDetails(specId);
                } else {
                    if (errDiv) {
                        errDiv.innerText = 'Save overrides failed: ' + body.message;
                        errDiv.classList.remove('hidden');
                    }
                }
            } catch (err) {
                if (errDiv) {
                    errDiv.innerText = 'Request failed: ' + err.message;
                    errDiv.classList.remove('hidden');
                }
            }
        }

        // --- PAYMENTS ---
        function getScopedPaymentRecords() {
            const records = state.paymentRecords || [];
            if (state.currentUser.role !== 'EXTERNAL_SALES') return records;
            const allowedCustomers = new Set(getScopedCustomers().map(c => c.id));
            return records.filter(r => allowedCustomers.has(r.customerId));
        }

        function derivePaymentStatus(invoiceAmount, receivedAmount) {
            const invoice = Number(invoiceAmount || 0);
            const received = Number(receivedAmount || 0);
            if (received <= 0) return 'UNPAID';
            if (invoice > 0 && received >= invoice) return 'PAID';
            return 'PARTIAL';
        }

        function paymentStatusBadge(status) {
            const s = String(status || 'UNPAID').toUpperCase();
            if (s === 'PAID') return '<span class="px-2 py-1 rounded bg-emerald-100 text-emerald-700 font-bold text-[10px]">PAID</span>';
            if (s === 'PARTIAL') return '<span class="px-2 py-1 rounded bg-amber-100 text-amber-700 font-bold text-[10px]">PARTIAL</span>';
            return '<span class="px-2 py-1 rounded bg-rose-100 text-rose-700 font-bold text-[10px]">UNPAID</span>';
        }

        function formatMoney(value, currency='USD') {
            return `${currency} ${Number(value || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
        }

        function renderPayments(container) {
            const records = getScopedPaymentRecords();
            const customerMap = Object.fromEntries((state.customers || []).map(c => [c.id, c]));
            const paid = records.filter(r => derivePaymentStatus(r.invoiceAmount, r.receivedAmount) === 'PAID').length;
            const partial = records.filter(r => derivePaymentStatus(r.invoiceAmount, r.receivedAmount) === 'PARTIAL').length;
            const unpaid = records.filter(r => derivePaymentStatus(r.invoiceAmount, r.receivedAmount) === 'UNPAID').length;
            const totalInvoice = records.reduce((a,r) => a + Number(r.invoiceAmount || 0), 0);
            const totalReceived = records.reduce((a,r) => a + Number(r.receivedAmount || 0), 0);
            const totalBalance = Math.max(0, totalInvoice - totalReceived);
            const role = state.currentUser.role;
            const externalNote = role === 'EXTERNAL_SALES' ? '<span class="text-[10px] font-bold bg-blue-50 text-blue-700 px-2 py-1 rounded border border-blue-100">OWN CUSTOMERS ONLY</span>' : '';

            container.innerHTML = `
                <div class="space-y-5">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <div>
                            <div class="flex items-center gap-2"><h2 class="text-xl font-bold text-slate-900">Payment Status</h2>${externalNote}</div>
                            <p class="text-xs text-slate-500 mt-1">Track customer receipts against DI / WCAT / Invoice for export coordination and commission readiness.</p>
                        </div>
                        ${canEditPayment() ? `<button onclick="openPaymentModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 shadow-sm"><i data-lucide="plus-circle" class="w-4 h-4"></i>Add Payment Record</button>` : `<span class="text-[10px] font-bold text-slate-500 bg-white border border-slate-200 rounded px-3 py-2">VIEW ONLY</span>`}
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
                        <div class="bg-white border border-slate-200 rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-slate-400">Invoices</div><div class="text-xl font-black mt-1">${records.length}</div></div>
                        <div class="bg-white border border-emerald-200 rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-emerald-600">Paid</div><div class="text-xl font-black mt-1 text-emerald-700">${paid}</div></div>
                        <div class="bg-white border border-amber-200 rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-amber-600">Partial</div><div class="text-xl font-black mt-1 text-amber-700">${partial}</div></div>
                        <div class="bg-white border border-rose-200 rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-rose-600">Unpaid</div><div class="text-xl font-black mt-1 text-rose-700">${unpaid}</div></div>
                        <div class="bg-slate-900 text-white rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-slate-300">Outstanding</div><div class="text-lg font-black mt-1">${formatMoney(totalBalance)}</div></div>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="ui-table w-full text-left text-xs min-w-[1050px]">
                                <thead class="bg-slate-100 border-b border-slate-200 text-[10px] uppercase text-slate-500 font-bold">
                                    <tr>
                                        <th class="p-3">DI</th>
                                        <th class="p-3">WCAT / Invoice</th>
                                        <th class="p-3">Customer</th>
                                        <th class="p-3 text-right">Invoice Amount</th>
                                        <th class="p-3 text-right">Received</th>
                                        <th class="p-3 text-right">Balance</th>
                                        <th class="p-3 text-center">Payment Date</th>
                                        <th class="p-3">Bank Reference</th>
                                        <th class="p-3 text-center">Status</th>
                                        <th class="p-3 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${records.length ? records.map(r => {
                                        const status = derivePaymentStatus(r.invoiceAmount, r.receivedAmount);
                                        const balance = Math.max(0, Number(r.invoiceAmount || 0) - Number(r.receivedAmount || 0));
                                        const c = customerMap[r.customerId];
                                        const di = (state.diRecords || []).find(d => d.id === r.diId);
                                        return `<tr class="hover:bg-slate-50">
                                            <td class="p-3"><div class="font-bold text-slate-800">${di?.diNo || '-'}</div><div class="text-[10px] font-mono text-slate-400">${r.diId || '-'}</div></td>
                                            <td class="p-3"><div class="font-mono font-bold text-blue-700">${r.wcatNo || '-'}</div><div class="text-[10px] text-slate-400">${r.id}</div></td>
                                            <td class="p-3 font-bold text-slate-800">${c?.name || r.customerId || '-'}</td>
                                            <td class="p-3 text-right font-bold">${formatMoney(r.invoiceAmount, r.currency)}</td>
                                            <td class="p-3 text-right font-bold text-emerald-700">${formatMoney(r.receivedAmount, r.currency)}</td>
                                            <td class="p-3 text-right font-bold ${balance > 0 ? 'text-rose-700' : 'text-slate-500'}">${formatMoney(balance, r.currency)}</td>
                                            <td class="p-3 text-center">${r.paymentDate || '-'}</td>
                                            <td class="p-3"><div class="font-mono text-[11px]">${r.bankReference || '-'}</div>${r.note ? `<div class="text-[10px] text-slate-400 mt-1 truncate max-w-[180px]" title="${r.note}">${r.note}</div>` : ''}</td>
                                            <td class="p-3 text-center">${paymentStatusBadge(status)}</td>
                                            <td class="p-3 text-center whitespace-nowrap">
                                                ${canEditPayment() ? `<button onclick="openPaymentModal('${r.id}')" class="text-amber-600 hover:underline font-bold mr-2">Edit</button>` : '<span class="text-slate-300">View</span>'}
                                                ${canDeletePayment() ? `<button onclick="deletePaymentRecord('${r.id}')" class="text-rose-600 hover:underline font-bold">Delete</button>` : ''}
                                            </td>
                                        </tr>`;
                                    }).join('') : `<tr><td colspan="10" class="p-8 text-center text-slate-400">No payment records in your scope.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    ${role === 'EXPORT' ? `<div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-800"><strong>EXPORT FULL ACCESS:</strong> Export can create and edit payment coordination records because the team coordinates customer payment follow-up. Delete remains Manager/Admin only.</div>` : ''}
                </div>`;
            lucide.createIcons();
        }

        function getPaymentEligibleDIs() {
            return getScopedDIs().filter(di => di.status !== 'CANCELLED' && !!di.wcatNo);
        }

        function openPaymentModal(paymentId='') {
            if (!canEditPayment()) { alert('Permission denied: Payment edit is limited to Export, Manager and Admin.'); return; }
            const existing = (state.paymentRecords || []).find(r => r.id === paymentId) || null;
            const availableDIs = getPaymentEligibleDIs();
            const defaultDI = existing ? availableDIs.find(di => di.id === existing.diId) : availableDIs[0];
            const po = defaultDI ? (state.pos || []).find(p => p.id === defaultDI.poId) : null;
            const customerId = existing?.customerId || po?.customerId || '';
            const invoiceAmount = existing?.invoiceAmount ?? 0;
            const receivedAmount = existing?.receivedAmount ?? 0;
            openModal(`
                <div class="flex justify-between items-start border-b border-slate-100 pb-3 mb-4">
                    <div><h3 class="text-lg font-bold text-slate-900">${existing ? 'Edit Payment Record' : 'Add Payment Record'}</h3><p class="text-xs text-slate-500 mt-1">Payment is tracked against one DI / WCAT so commission can later use the same reference.</p></div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <label class="space-y-1 md:col-span-2"><span class="font-bold text-slate-600">WCAT / DI</span><select id="payDiId" onchange="syncPaymentDIFields()" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white">${availableDIs.map(di => `<option value="${di.id}" ${di.id === (existing?.diId || defaultDI?.id) ? 'selected' : ''}>${di.wcatNo || 'Waiting WCAT'} · ${di.diNo || di.id}</option>`).join('')}</select></label>
                    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 border border-slate-200 rounded-lg p-3">
                        <div><div class="text-[10px] uppercase font-bold text-slate-400">Customer</div><div id="payCustomerDisplay" class="font-bold text-slate-800 mt-1">-</div></div>
                        <div><div class="text-[10px] uppercase font-bold text-slate-400">PO</div><div id="payPoDisplay" class="font-bold text-slate-800 mt-1">-</div></div>
                        <div><div class="text-[10px] uppercase font-bold text-slate-400">WCAT</div><div id="payWcatDisplay" class="font-mono font-bold text-blue-700 mt-1">-</div></div>
                    </div>
                    <label class="space-y-1"><span class="font-bold text-slate-600">Currency</span><select id="payCurrency" class="w-full border border-slate-300 rounded-lg px-3 py-2"><option value="USD" ${(existing?.currency || po?.poCurrency || 'USD')==='USD'?'selected':''}>USD</option><option value="EUR" ${existing?.currency==='EUR'?'selected':''}>EUR</option><option value="THB" ${existing?.currency==='THB'?'selected':''}>THB</option></select></label>
                    <label class="space-y-1"><span class="font-bold text-slate-600">Payment Date</span><input id="payDate" type="date" value="${existing?.paymentDate || getTodayIso()}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
                    <label class="space-y-1"><span class="font-bold text-slate-600">Invoice Amount</span><input id="payInvoice" type="number" step="0.01" value="${invoiceAmount}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
                    <label class="space-y-1"><span class="font-bold text-slate-600">Received Amount</span><input id="payReceived" type="number" step="0.01" value="${receivedAmount}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
                    <label class="space-y-1 md:col-span-2"><span class="font-bold text-slate-600">Bank Reference</span><input id="payBankRef" value="${existing?.bankReference || ''}" class="w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="TT / Bank reference"></label>
                    <label class="space-y-1 md:col-span-2"><span class="font-bold text-slate-600">Note</span><textarea id="payNote" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2">${existing?.note || ''}</textarea></label>
                </div>
                <input type="hidden" id="payRecordId" value="${existing?.id || ''}">
                <input type="hidden" id="payCustomerId" value="${customerId}">
                <div class="mt-5 flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 text-xs font-bold">Cancel</button><button onclick="savePaymentRecord()" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">Save Payment</button></div>
            `);
            syncPaymentDIFields();
        }

        function syncPaymentDIFields() {
            const diId = document.getElementById('payDiId')?.value;
            const di = (state.diRecords || []).find(d => d.id === diId);
            const po = di ? (state.pos || []).find(p => p.id === di.poId) : null;
            const customer = po ? (state.customers || []).find(c => c.id === po.customerId) : null;
            if (!di) return;
            const cust = document.getElementById('payCustomerId'); if (cust) cust.value = po?.customerId || '';
            const custDisplay = document.getElementById('payCustomerDisplay'); if (custDisplay) custDisplay.textContent = customer?.name || po?.customerId || '-';
            const poDisplay = document.getElementById('payPoDisplay'); if (poDisplay) poDisplay.textContent = po?.customerPoNo || po?.id || '-';
            const wcatDisplay = document.getElementById('payWcatDisplay'); if (wcatDisplay) wcatDisplay.textContent = di.wcatNo || '-';
            const currency = document.getElementById('payCurrency'); if (currency && po?.poCurrency) currency.value = po.poCurrency;
        }

        function savePaymentRecord() {
            if (!canEditPayment()) { alert('Permission denied.'); return; }
            const id = document.getElementById('payRecordId').value;
            const diId = document.getElementById('payDiId').value;
            const di = (state.diRecords || []).find(d => d.id === diId);
            const po = di ? (state.pos || []).find(p => p.id === di.poId) : null;
            if (!di || !di.wcatNo) { alert('Select a DI that already has WCAT / Invoice assigned.'); return; }
            const invoiceAmount = Number(document.getElementById('payInvoice').value || 0);
            const receivedAmount = Number(document.getElementById('payReceived').value || 0);
            if (invoiceAmount <= 0) { alert('Invoice Amount must be greater than 0.'); return; }
            if (receivedAmount < 0) { alert('Received Amount cannot be negative.'); return; }
            const record = {
                id: id || `PAY-${new Date().getFullYear()}-${String((state.paymentRecords || []).length + 1).padStart(3,'0')}`,
                diId,
                customerId: po?.customerId || document.getElementById('payCustomerId').value,
                wcatNo: di?.wcatNo || '-',
                currency: document.getElementById('payCurrency').value,
                invoiceAmount,
                receivedAmount,
                paymentDate: document.getElementById('payDate').value,
                bankReference: document.getElementById('payBankRef').value.trim(),
                status: derivePaymentStatus(invoiceAmount, receivedAmount),
                note: document.getElementById('payNote').value.trim()
            };
            const idx = (state.paymentRecords || []).findIndex(r => r.id === id);
            if (idx >= 0) state.paymentRecords[idx] = record; else state.paymentRecords.push(record);
            if (di) di.paymentStatus = record.status;
            closeModal();
            renderView();
        }

        function deletePaymentRecord(paymentId) {
            if (!canDeletePayment()) { alert('Delete is limited to Manager / Admin.'); return; }
            if (!confirm('Delete this payment record?')) return;
            state.paymentRecords = (state.paymentRecords || []).filter(r => r.id !== paymentId);
            renderView();
        }

        // --- COMMISSION ---
        function getActualShippedMtForDI(di) {
            return (state.loadingEvents || []).filter(ev => ev.diId === di.id).reduce((sum, ev) => sum + ((Number(ev.actualBags || 0) * Number(di.packageWeightKg || 0)) / 1000), 0);
        }
        function getPaymentStatusForDI(diId) {
            const r = (state.paymentRecords || []).find(x => x.diId === diId);
            return r ? derivePaymentStatus(r.invoiceAmount, r.receivedAmount) : 'UNPAID';
        }
        function getCommissionRows() {
            const paidMap = Object.fromEntries((state.commissionPaidSnapshots || []).map(x => [x.diId, x]));
            let rows = (state.diRecords || []).filter(di => di.status !== 'CANCELLED').map(di => {
                const po = (state.pos || []).find(p => p.id === di.poId);
                if (!po || !po.commissionRecipientId || Number(po.commissionRateUsdPerMt || 0) <= 0) return null;
                const actualMt = getActualShippedMtForDI(di);
                const paymentStatus = getPaymentStatusForDI(di.id);
                const snap = paidMap[di.id];
                const rate = snap ? Number(snap.rateSnapshotUsdPerMt || 0) : Number(po.commissionRateUsdPerMt || 0);
                const amount = snap ? Number(snap.amountUsd || 0) : actualMt * rate;
                const status = snap ? 'PAID' : (actualMt > 0 && paymentStatus === 'PAID' ? 'PAYABLE' : 'PENDING');
                return { diId: di.id, diNo: di.diNo, wcatNo: di.wcatNo, poId: po.id, recipientId: po.commissionRecipientId, actualMt, rateUsdPerMt: rate, paymentStatus, amountUsd: amount, status, paidSnapshot: snap || null };
            }).filter(Boolean);
            if (state.currentUser.role === 'EXTERNAL_SALES') rows = rows.filter(r => r.recipientId === state.currentUser.id);
            return rows;
        }
        function commissionStatusBadge(status) {
            if (status === 'PAID') return '<span class="px-2 py-1 rounded bg-emerald-100 text-emerald-700 font-bold text-[10px]">PAID</span>';
            if (status === 'PAYABLE') return '<span class="px-2 py-1 rounded bg-blue-100 text-blue-700 font-bold text-[10px]">PAYABLE</span>';
            return '<span class="px-2 py-1 rounded bg-amber-100 text-amber-700 font-bold text-[10px]">PENDING</span>';
        }
        function renderCommissions(container) {
            const rows = getCommissionRows();
            const sums = k => rows.filter(r=>r.status===k).reduce((a,r)=>a+r.amountUsd,0);
            const requests = (state.commissionRateChangeRequests || []).filter(r=>r.status==='PENDING');
            container.innerHTML = `<div class="space-y-5"><div class="flex justify-between items-center"><div><h2 class="text-xl font-bold text-slate-900">Commission</h2><p class="text-xs text-slate-500">Actual Shipped MT × approved PO rate; PAYABLE only after DI payment is PAID.</p></div></div>
            <div class="grid grid-cols-3 gap-3"><div class="bg-white border border-amber-200 rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-amber-600">Pending</div><div class="text-xl font-black">${formatMoney(sums('PENDING'))}</div></div><div class="bg-white border border-blue-200 rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-blue-600">Payable</div><div class="text-xl font-black">${formatMoney(sums('PAYABLE'))}</div></div><div class="bg-white border border-emerald-200 rounded-xl p-4"><div class="text-[10px] uppercase font-bold text-emerald-600">Paid</div><div class="text-xl font-black">${formatMoney(sums('PAID'))}</div></div></div>
            ${['MANAGER','ADMIN'].includes(state.currentUser.role) && requests.length ? `<div class="bg-white border border-fuchsia-200 rounded-xl overflow-hidden"><div class="p-3 font-bold text-fuchsia-900">Pending Rate Change Approval</div>${requests.map(r=>`<div class="p-3 border-t text-xs flex justify-between items-center"><div><strong>${r.poId}</strong> · USD ${Number(r.oldRate).toFixed(2)} → <strong>USD ${Number(r.requestedRate).toFixed(2)}</strong><div class="text-slate-500">${r.reason}</div></div><div class="flex gap-2"><button onclick="reviewCommissionRateChange('${r.id}','APPROVED')" class="px-3 py-1.5 bg-emerald-600 text-white rounded font-bold">Approve</button><button onclick="reviewCommissionRateChange('${r.id}','REJECTED')" class="px-3 py-1.5 bg-rose-600 text-white rounded font-bold">Reject</button></div></div>`).join('')}</div>`:''}
            <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto"><table class="ui-table w-full text-xs min-w-[1000px]"><thead class="bg-slate-100 text-[10px] uppercase text-slate-500"><tr><th class="p-3 text-left">Sales</th><th class="p-3 text-left">PO</th><th class="p-3 text-left">DI</th><th class="p-3 text-left">WCAT</th><th class="p-3 text-right">Actual MT</th><th class="p-3 text-right">Rate</th><th class="p-3 text-center">Payment</th><th class="p-3 text-right">Commission</th><th class="p-3 text-center">Status</th><th class="p-3 text-center">Action</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-t"><td class="p-3">${(state.users||[]).find(u=>u.id===r.recipientId)?.name||r.recipientId}</td><td class="p-3 font-mono">${r.poId}</td><td class="p-3">${r.diNo||r.diId}</td><td class="p-3 font-mono">${r.wcatNo||'-'}</td><td class="p-3 text-right font-bold">${r.actualMt.toFixed(3)}</td><td class="p-3 text-right">$${r.rateUsdPerMt.toFixed(2)}</td><td class="p-3 text-center">${paymentStatusBadge(r.paymentStatus)}</td><td class="p-3 text-right font-black">${formatMoney(r.amountUsd)}</td><td class="p-3 text-center">${commissionStatusBadge(r.status)}</td><td class="p-3 text-center">${r.status==='PAYABLE' && ['MANAGER','ADMIN'].includes(state.currentUser.role) ? `<button onclick="markCommissionPaid('${r.diId}')" class="px-2 py-1 bg-emerald-600 text-white rounded font-bold">Mark as Paid</button>` : '-'}</td></tr>`).join('')}</tbody></table></div></div>`;
        }
        function markCommissionPaid(diId) {
            if (!['MANAGER','ADMIN'].includes(state.currentUser.role)) { alert('Permission denied.'); return; }
            const row = getCommissionRows().find(r=>r.diId===diId);
            if (!row || row.status !== 'PAYABLE') return;
            const note = prompt('Commission payment note (optional):','') || '';
            state.commissionPaidSnapshots.push({ diId, poId: row.poId, recipientId: row.recipientId, rateSnapshotUsdPerMt: row.rateUsdPerMt, actualMtSnapshot: row.actualMt, amountUsd: row.amountUsd, paidDate: getTodayIso(), paidBy: state.currentUser.id, note });
            renderView();
        }
        function requestCommissionRateChange(poId) {
            if (state.currentUser.role !== 'SALES_SUPPORT') { alert('Only Sales Support can request a commission rate change.'); return; }
            const po = (state.pos||[]).find(p=>p.id===poId); if (!po) return;

            loadingEvent.loadingDateHistory=Array.isArray(loadingEvent.loadingDateHistory)?loadingEvent.loadingDateHistory:[];

        function hydrateData(data) {
            if(!data) return;

            if(data.Customers && data.Customers.length > 0) {
                state.customers = data.Customers.map(c => {
                    let parsedContacts = [];
                    if (c.contacts_json) {
                        try { parsedContacts = JSON.parse(c.contacts_json); } catch(err) {}
                    }
                    if (parsedContacts.length === 0 && (c.contact_person || c.contact_email)) {
                        parsedContacts = [{ name: c.contact_person, position: 'Primary Contact', email: c.contact_email, phone: c.contact_phone, isPrimary: true }];
                    }
                    return {
                        id: c.customer_id,
                        code: c.customer_code,
                        name: c.customer_name,
                        source: c.customer_source,
                        ownerId: c.owner_id,
                        status: c.customer_status,
                        country: c.country,
                        contactPerson: c.contact_person,
                        contactEmail: c.contact_email,
                        contactPhone: c.contact_phone,
                        contacts: parsedContacts,
                        billingAddress: c.billing_address,
                        taxId: c.tax_id,
                        defaultPaymentTerm: c.default_payment_term,

            if(data.Shipments && data.Shipments.length > 0) state.shipments = data.Shipments.map(s => ({ id: s.shipment_id, wcatNo: s.wcat_no, poId: s.po_id, planned_loading_date: s.planned_loading_date, plannedContainers: parseNum(s.planned_containers, 0), plannedTotalMt: parseNum(s.planned_total_mt, 0), goodsStatus: s.goods_status, productionReady: s.production_ready, packagingReady: s.packaging_ready, bookingNo: s.booking_no, vesselVoyage: s.vessel_voyage, invoiceAmount: parseNum(s.invoice_amount, 0), paymentStatus: s.payment_status }));
            renderView();

        async function callBackend(action, payload, onSuccess, onFailure) {
            const fail = (message) => {
                const msg = message || 'Unable to complete the request.';
                console.error('Backend error:', action, msg);
                if (typeof onFailure === 'function') onFailure(msg);
                else alert(msg);
            };
            try {
                const response = await fetch('/api/gateway', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action,
                        sessionToken: getStoredSessionToken(),
                        payload: payload || {}
                    })
                });
                const res = await response.json().catch(() => null);
                if (!response.ok || res?.status !== 'SUCCESS') {
                    fail(res?.message || `Backend action ${action} failed.`);
                    return;
                }
                if (typeof onSuccess === 'function') onSuccess(res.data);
            } catch (err) {
                fail(err?.message || `Backend action ${action} failed.`);
            }
        }

        function initApp() {
            bootstrapAuth();
        }

        // Do not wait for window.onload: external Tailwind/Lucide CDNs may be unavailable
        // in local/preview environments. The DOM is enough to render navigation.
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
