        function updateNewPOPriceSuggestion() {
            const customerId = document.getElementById('newPoCustomerId')?.value || '';
            const productId = document.getElementById('newPoProductId')?.value || '';
            const poDate = document.getElementById('newPoDate')?.value || getTodayIso();
            const suggestion = getSuggestedSellingPrice(customerId, productId, poDate);
            const priceInput = document.getElementById('newPoPrice');
            const label = document.getElementById('newPoSuggestedPrice');
            if (priceInput && suggestion.price > 0) priceInput.value = suggestion.price.toFixed(2);
            if (label) {
                label.innerHTML = suggestion.price > 0
                    ? `Suggested Selling Price: <strong>USD ${suggestion.price.toFixed(2)} / MT</strong> · ${suggestion.source} · ${suggestion.reference}`
                    : '<strong class="text-amber-700">No active approved price found</strong>';
            }
            updateNewPOPriceWarning();
        }

        function updateNewPOPriceWarning() {
            const customerId = document.getElementById('newPoCustomerId')?.value || '';
            const productId = document.getElementById('newPoProductId')?.value || '';
            const poDate = document.getElementById('newPoDate')?.value || getTodayIso();
            const entered = parseFloat(document.getElementById('newPoPrice')?.value) || 0;
            const suggestion = getSuggestedSellingPrice(customerId, productId, poDate);
            const warning = document.getElementById('newPoPriceWarning');
            if (!warning) return;
            const needsApproval = suggestion.price > 0 && entered > 0 && entered < suggestion.price;
            warning.className = needsApproval ? 'mt-1 text-[10px] font-bold text-amber-700' : 'hidden mt-1 text-[10px] font-bold text-amber-700';
            warning.textContent = needsApproval ? `Selling Price ต่ำกว่า Suggested Price (USD ${suggestion.price.toFixed(2)}) → NEEDS_APPROVAL` : '';
        }

        function validateNewPODeliveryPeriod(startDate, endDate) {
            if (!startDate || !endDate) return { valid: false, message: 'กรุณาระบุ Delivery Start และ Delivery End' };
            if (endDate < startDate) return { valid: false, message: 'Delivery End ต้องไม่มาก่อน Delivery Start' };
            return { valid: true, message: '' };
        }

        function isProductReadyForPO(product) {
            if (!product) return false;
            const statusOk = !product.status || String(product.status).toUpperCase() === 'ACTIVE';
            const hasCoreSpec = [product.starchMin, product.moistureMax, product.sandSilicaMax].every(v => v !== null && v !== undefined && v !== '');
            return statusOk && hasCoreSpec;
        }

        function formatDeliveryPeriod(startDate, endDate) {
            if (!startDate || !endDate) return '-';
            const fmt = value => {
                const d = new Date(value + 'T00:00:00');
                if (Number.isNaN(d.getTime())) return value;
                return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            };
            return `${fmt(startDate)} – ${fmt(endDate)}`;
        }

        function renderNewPOReview() {
            const customerId = document.getElementById('newPoCustomerId')?.value || '';
            const productId = document.getElementById('newPoProductId')?.value || '';
            const customer = (state.customers || []).find(c => c.id === customerId);
            const product = (state.products || []).find(p => p.id === productId);
            const qty = parseFloat(document.getElementById('newPoQty')?.value) || 0;
            const tol = parseFloat(document.getElementById('newPoTolerancePct')?.value) || 0;
            const max = qty * (1 + tol / 100);
            const price = parseFloat(document.getElementById('newPoPrice')?.value) || 0;
            const priceSuggestion = getSuggestedSellingPrice(customerId, productId, document.getElementById('newPoDate')?.value || getTodayIso());
            const priceApproval = priceSuggestion.price > 0 && price > 0 && price < priceSuggestion.price ? 'NEEDS_APPROVAL' : 'APPROVED';
            const shipmentType = document.getElementById('newPoShipmentType')?.value || '-';
            const containerType = shipmentType === 'Container' ? (document.getElementById('newPoContainerType')?.value || '-') : '-';
            const packaging = document.getElementById('newPoPackagingSelect')?.value || '-';
            const bagKg = parseFloat(document.getElementById('newPoPackageWeightKg')?.value) || 0;
            const units = parseFloat(document.getElementById('newPoUnitsPerCont')?.value) || 0;
            const perLoad = parseFloat(document.getElementById('newPoTotalWeightMt')?.value) || 0;
            const start = document.getElementById('newPoDeliveryStart')?.value || '';
            const end = document.getElementById('newPoDeliveryEnd')?.value || '';
            return `
                <div class="grid grid-cols-2 gap-x-4 gap-y-1">
                    <span>Customer</span><strong class="text-right">${customer?.name || '-'}</strong>
                    <span>Product</span><strong class="text-right">${product?.shortName || product?.name || '-'}</strong>
                    <span>Delivery Period</span><strong class="text-right">${formatDeliveryPeriod(start, end)}</strong>
                    <span>Contract</span><strong class="text-right">${qty.toFixed(3)} MT ±${tol}%</strong>
                    <span>Maximum Allowed</span><strong class="text-right">${max.toFixed(3)} MT</strong>
                    <span>Price</span><strong class="text-right">USD ${price.toFixed(2)} / MT</strong>
                    <span>Price Source</span><strong class="text-right">${priceSuggestion.source}${priceSuggestion.reference ? ' · '+priceSuggestion.reference : ''}</strong>
                    <span>Price Approval</span><strong class="text-right ${priceApproval === 'NEEDS_APPROVAL' ? 'text-amber-700' : 'text-emerald-700'}">${priceApproval}</strong>
                    <span>Shipment</span><strong class="text-right">${shipmentType}${containerType !== '-' ? ' · '+containerType : ''}</strong>
                    <span>Packaging</span><strong class="text-right">${packaging}${bagKg ? ` · ${bagKg} kg` : ''}${units ? ` · ${units} units` : ''}</strong>
                    <span>MT / Load</span><strong class="text-right">${perLoad.toFixed(3)} MT</strong>
                </div>`;
        }

        function updateNewPOReview() {
            const start = document.getElementById('newPoDeliveryStart')?.value || '';
            const end = document.getElementById('newPoDeliveryEnd')?.value || '';
            const deliveryCheck = validateNewPODeliveryPeriod(start, end);
            const msg = document.getElementById('newPoDeliveryMsg');
            if (msg) {
                msg.className = deliveryCheck.valid ? 'hidden text-[10px] font-semibold' : 'text-[10px] font-semibold text-red-700';
                msg.textContent = deliveryCheck.message;
            }
            const box = document.getElementById('newPoReviewBox');
            if (box) box.innerHTML = renderNewPOReview();
        }

        function autoFillCustomerDefaults(customerId) {
            const c = (state.customers || []).find(x => x.id === customerId);
            const portInput = document.getElementById('newPoPort');
            if (c && portInput && !portInput.value) {
                portInput.value = c.dischargePort || '';
            }
        }

        function recalcNewTolerance() {
            const contractQty = parseFloat(document.getElementById('newPoQty')?.value) || 0;
            const tolerancePct = parseFloat(document.getElementById('newPoTolerancePct')?.value) || 0;
            const maxInvInput = document.getElementById('newPoMaxInvQty');
            if (maxInvInput) {
                const maxVal = contractQty * (1 + (tolerancePct / 100));
                maxInvInput.value = parseFloat(maxVal.toFixed(2));
            }
            updateNewPOReview();
        }

        function handleNewShipmentTypeChange(shipmentType) {
            const wrapper = document.getElementById('newContainerTypeWrapper');
            const pkgSelect = document.getElementById('newPoPackagingSelect');
            if (wrapper) {
                if (shipmentType === 'Container') wrapper.classList.remove('hidden');
                else wrapper.classList.add('hidden');
            }
            if ((shipmentType === 'Bulk Vessel' || shipmentType === 'Truck') && pkgSelect) {
                pkgSelect.value = 'NONE';
                handleNewPackagingSelectChange('NONE');
            }
        }

        function handleNewPackagingSelectChange(val) {
            const customInput = document.getElementById('newPoPackagingCustom');
            const weightWrapper = document.getElementById('newPkgWeightWrapper');
            const unitsWrapper = document.getElementById('newPkgUnitsWrapper');
            const totalWeightWrapper = document.getElementById('newTotalWeightWrapper');
            const totalWeightInput = document.getElementById('newPoTotalWeightMt');
            const helpText = document.getElementById('newTxtWeightHelp');
            const weightInput = document.getElementById('newPoPackageWeightKg');

            if (val === 'CUSTOM') {
                if (customInput) customInput.classList.remove('hidden');
            } else {
                if (customInput) customInput.classList.add('hidden');
            }

            if (val === 'NONE') {
                if (weightWrapper) weightWrapper.classList.add('hidden');
                if (unitsWrapper) unitsWrapper.classList.add('hidden');
                if (totalWeightWrapper) totalWeightWrapper.className = 'col-span-2';
                if (totalWeightInput) {
                    totalWeightInput.readOnly = false;
                    totalWeightInput.classList.remove('cursor-not-allowed', 'bg-emerald-50');
                    totalWeightInput.classList.add('bg-white');
                    if (!totalWeightInput.value || totalWeightInput.value == 0) totalWeightInput.value = 27.0;
                }
                if (helpText) helpText.innerText = '* โหมดไม่มีบรรจุภัณฑ์ (In Bulk): ระบุน้ำหนักบรรทุกเฉลี่ยต่อตู้/คัน/เที่ยวเรือได้โดยตรง';
            } else {
                if (weightWrapper) weightWrapper.classList.remove('hidden');
                if (unitsWrapper) unitsWrapper.classList.remove('hidden');
                if (totalWeightWrapper) totalWeightWrapper.className = '';
                if (totalWeightInput) {
                    totalWeightInput.readOnly = true;
                    totalWeightInput.classList.add('cursor-not-allowed', 'bg-emerald-50');
                    totalWeightInput.classList.remove('bg-white');
                }
                if (helpText) helpText.innerText = '* คำนวณอัตโนมัติจาก (น้ำหนักต่อหน่วย kg × จำนวน) ÷ 1,000';

                if (val === 'Jumbo Bag 850 kg' && weightInput) weightInput.value = 850;
                else if (val === 'Jumbo Bag 950 kg' && weightInput) weightInput.value = 950;
                else if (val === 'Bulk Container' || val === 'Bulk Container + Liner') {
                    if (weightInput) weightInput.value = 1000;
                }
                recalcNewContainerWeight();
            }
        }

        function recalcNewContainerWeight() {
            const pkgSelect = document.getElementById('newPoPackagingSelect')?.value;
            if (pkgSelect === 'NONE') return;

            const weightKg = parseFloat(document.getElementById('newPoPackageWeightKg')?.value) || 0;
            const units = parseFloat(document.getElementById('newPoUnitsPerCont')?.value) || 0;
            const totalMtInput = document.getElementById('newPoTotalWeightMt');
            if (totalMtInput) {
                const totalMt = (weightKg * units) / 1000;
                totalMtInput.value = totalMt > 0 ? parseFloat(totalMt.toFixed(3)) : 0;
            }
            updateNewPOReview();
        }

        function handleNewPOSubmit(e, poId) {
            e.preventDefault();
            const pkgSelect = document.getElementById('newPoPackagingSelect').value;
            const pkgCustom = document.getElementById('newPoPackagingCustom').value;
            let finalPackaging = pkgSelect;
            if (pkgSelect === 'CUSTOM') finalPackaging = pkgCustom.trim() || 'Custom Package';
            else if (pkgSelect === 'NONE') finalPackaging = 'ไม่มีบรรจุภัณฑ์ (In Bulk)';

            const contractQty = parseFloat(document.getElementById('newPoQty').value) || 0;
            const tolerancePct = parseFloat(document.getElementById('newPoTolerancePct').value) || 0;
            const maxInvQty = parseFloat(document.getElementById('newPoMaxInvQty').value) || (contractQty * 1.05);
            const deliveryStart = document.getElementById('newPoDeliveryStart')?.value || '';
            const deliveryEnd = document.getElementById('newPoDeliveryEnd')?.value || '';
            const deliveryCheck = validateNewPODeliveryPeriod(deliveryStart, deliveryEnd);
            const selectedProduct = (state.products || []).find(p => p.id === document.getElementById('newPoProductId').value);
            const sellingPrice = parseFloat(document.getElementById('newPoPrice').value) || 0;
            const priceSuggestion = getSuggestedSellingPrice(document.getElementById('newPoCustomerId').value, document.getElementById('newPoProductId').value, document.getElementById('newPoDate').value || getTodayIso());
            const priceNeedsApproval = priceSuggestion.price > 0 && sellingPrice < priceSuggestion.price;
            if (!deliveryCheck.valid) { alert(deliveryCheck.message); return; }
            if (!isProductReadyForPO(selectedProduct)) { alert('Product นี้ยังไม่มี Active Standard Spec ที่พร้อมใช้ จึงยังเปิด PO ไม่ได้'); return; }
            if (contractQty <= 0) { alert('Contract Qty ต้องมากกว่า 0'); return; }
            if (sellingPrice <= 0) { alert('Selling Price ต้องมากกว่า 0'); return; }

            const newPo = {
                id: poId,
                customerId: document.getElementById('newPoCustomerId').value,
                customerPoNo: document.getElementById('newPoNo').value,
                poDate: document.getElementById('newPoDate').value,
                deliveryStart,
                deliveryEnd,
                productId: document.getElementById('newPoProductId').value,
                contractQtyMt: contractQty,
                tolerancePct: tolerancePct,
                maxInvoiceQtyMt: maxInvQty,
                shipmentType: document.getElementById('newPoShipmentType').value,
                containerType: document.getElementById('newPoShipmentType').value === 'Container' ? document.getElementById('newPoContainerType').value : '-',
                packaging: finalPackaging,
                packageWeightKg: pkgSelect === 'NONE' ? 0 : (parseFloat(document.getElementById('newPoPackageWeightKg').value) || 0),
                unitsPerContainer: pkgSelect === 'NONE' ? 0 : (parseFloat(document.getElementById('newPoUnitsPerCont').value) || 0),
                totalWeightPerContainerMt: parseFloat(document.getElementById('newPoTotalWeightMt').value) || 0,
                poCurrency: 'USD',
                sellingPrice,
                commissionRecipientId: document.getElementById('newPoCommissionRecipient')?.value || '',
                commissionRateUsdPerMt: parseFloat(document.getElementById('newPoCommissionRate')?.value) || 0,
                incoterm: document.getElementById('newPoIncoterm').value,
                destinationPort: document.getElementById('newPoPort').value,
                commercialApprovalStatus: 'APPROVED',
                poStatus: document.getElementById('newPoStatus').value
            };

            callBackend('UPDATE_PO', {
                action_type: 'CREATE',
                po_id: newPo.id,
                customerId: newPo.customerId,
                customerPoNo: newPo.customerPoNo,
                poDate: newPo.poDate,
                productId: newPo.productId,
                contractQtyMt: newPo.contractQtyMt,
                tolerancePct: newPo.tolerancePct,
                maxInvoiceQtyMt: newPo.maxInvoiceQtyMt,
                incoterm: newPo.incoterm,
                destinationPort: newPo.destinationPort,
                shipmentType: newPo.shipmentType,
                containerType: newPo.containerType,
                packaging: newPo.packaging,
                packageWeightKg: newPo.packageWeightKg,
                unitsPerContainer: newPo.unitsPerContainer,
                totalWeightPerContainerMt: newPo.totalWeightPerContainerMt,
                poCurrency: newPo.poCurrency,
                sellingPrice: newPo.sellingPrice,
                commercialApprovalStatus: newPo.commercialApprovalStatus,
                poStatus: newPo.poStatus,
                deliveryStart: newPo.deliveryStart,
                deliveryEnd: newPo.deliveryEnd,
                commissionRecipientId: newPo.commissionRecipientId,
                commissionRateUsdPerMt: newPo.commissionRateUsdPerMt
            }, () => {
                state.pos.push(newPo);
                closeModal();
                goToPODetail(newPo.id);

        function recalcTolerance() {
            const contractQty = parseFloat(document.getElementById('editPoQty')?.value) || 0;
            const tolerancePct = parseFloat(document.getElementById('editPoTolerancePct')?.value) || 0;
            const maxInvInput = document.getElementById('editPoMaxInvQty');
            if (maxInvInput) {
                const maxVal = contractQty * (1 + (tolerancePct / 100));
                maxInvInput.value = parseFloat(maxVal.toFixed(2));
            }
        }

        function handleShipmentTypeChange(shipmentType) {
            const wrapper = document.getElementById('containerTypeWrapper');
            const pkgSelect = document.getElementById('editPoPackagingSelect');
            if (wrapper) {
                if (shipmentType === 'Container') wrapper.classList.remove('hidden');
                else wrapper.classList.add('hidden');
            }
            if ((shipmentType === 'Bulk Vessel' || shipmentType === 'Truck') && pkgSelect) {
                pkgSelect.value = 'NONE';
                handlePackagingSelectChange('NONE');
            }
        }

        function handlePackagingSelectChange(val) {
            const customInput = document.getElementById('editPoPackagingCustom');
            const weightWrapper = document.getElementById('pkgWeightWrapper');
            const unitsWrapper = document.getElementById('pkgUnitsWrapper');
            const totalWeightWrapper = document.getElementById('totalWeightWrapper');
            const totalWeightInput = document.getElementById('editPoTotalWeightMt');
            const helpText = document.getElementById('txtWeightHelp');
            const weightInput = document.getElementById('editPoPackageWeightKg');

            if (val === 'CUSTOM') {
                if (customInput) customInput.classList.remove('hidden');
            } else {
                if (customInput) customInput.classList.add('hidden');
            }

            if (val === 'NONE') {
                if (weightWrapper) weightWrapper.classList.add('hidden');
                if (unitsWrapper) unitsWrapper.classList.add('hidden');
                if (totalWeightWrapper) totalWeightWrapper.className = 'col-span-2';
                if (totalWeightInput) {
                    totalWeightInput.readOnly = false;
                    totalWeightInput.classList.remove('cursor-not-allowed', 'bg-emerald-50');
                    totalWeightInput.classList.add('bg-white');
                    if (!totalWeightInput.value || totalWeightInput.value == 0) totalWeightInput.value = 27.0;
                }
                if (helpText) helpText.innerText = '* โหมดไม่มีบรรจุภัณฑ์ (In Bulk): ระบุน้ำหนักบรรทุกเฉลี่ยต่อตู้/คัน/เที่ยวเรือได้โดยตรง';
            } else {
                if (weightWrapper) weightWrapper.classList.remove('hidden');
                if (unitsWrapper) unitsWrapper.classList.remove('hidden');
                if (totalWeightWrapper) totalWeightWrapper.className = '';
                if (totalWeightInput) {
                    totalWeightInput.readOnly = true;
                    totalWeightInput.classList.add('cursor-not-allowed', 'bg-emerald-50');
                    totalWeightInput.classList.remove('bg-white');
                }
                if (helpText) helpText.innerText = '* คำนวณอัตโนมัติจาก (น้ำหนักต่อหน่วย kg × จำนวน) ÷ 1,000';

                if (val === 'Jumbo Bag 850 kg' && weightInput) weightInput.value = 850;
                else if (val === 'Jumbo Bag 950 kg' && weightInput) weightInput.value = 950;
                else if (val === 'Bulk Container' || val === 'Bulk Container + Liner') {
                    if (weightInput) weightInput.value = 1000;
                }
                recalcContainerWeight();
            }
        }

        function recalcContainerWeight() {
            const pkgSelect = document.getElementById('editPoPackagingSelect')?.value;
            if (pkgSelect === 'NONE') return;

            const weightKg = parseFloat(document.getElementById('editPoPackageWeightKg')?.value) || 0;
            const units = parseFloat(document.getElementById('editPoUnitsPerCont')?.value) || 0;
            const totalMtInput = document.getElementById('editPoTotalWeightMt');
            if (totalMtInput) {
                const totalMt = (weightKg * units) / 1000;
                totalMtInput.value = totalMt > 0 ? parseFloat(totalMt.toFixed(3)) : 0;
            }
        }

        function saveEditPO(e, poId) {
            e.preventDefault();
            const po = (state.pos || []).find(p => p.id === poId);
            if (!po) return;
            const pkgSelect = document.getElementById('editPoPackagingSelect').value;
            const pkgCustom = document.getElementById('editPoPackagingCustom').value;
            let finalPackaging = pkgSelect;
            if (pkgSelect === 'CUSTOM') finalPackaging = pkgCustom.trim() || 'Custom Package';
            else if (pkgSelect === 'NONE') finalPackaging = 'ไม่มีบรรจุภัณฑ์ (In Bulk)';
            const contractQty = parseFloat(document.getElementById('editPoQty').value) || 0;
            const tolerancePct = parseFloat(document.getElementById('editPoTolerancePct').value) || 0;
            const maxInvQty = parseFloat(document.getElementById('editPoMaxInvQty').value) || (contractQty * 1.05);
            const draft = {
                customerPoNo: document.getElementById('editPoNo').value,
                poDate: document.getElementById('editPoDate').value,
                customerId: document.getElementById('editPoCustomerId').value,
                productId: document.getElementById('editPoProductId').value,
                contractQtyMt: contractQty,
                tolerancePct,
                maxInvoiceQtyMt: maxInvQty,
                shipmentType: document.getElementById('editPoShipmentType').value,
                packaging: finalPackaging,
                packageWeightKg: pkgSelect === 'NONE' ? 0 : (parseFloat(document.getElementById('editPoPackageWeightKg').value) || 0),
                unitsPerContainer: pkgSelect === 'NONE' ? 0 : (parseFloat(document.getElementById('editPoUnitsPerCont').value) || 0),
                totalWeightPerContainerMt: parseFloat(document.getElementById('editPoTotalWeightMt').value) || 0,
                sellingPrice: parseFloat(document.getElementById('editPoPrice').value) || 0,
                incoterm: document.getElementById('editPoIncoterm').value,
                destinationPort: document.getElementById('editPoPort').value,
                poStatus: document.getElementById('editPoStatus').value
            };
            draft.containerType = draft.shipmentType === 'Container' ? document.getElementById('editPoContainerType').value : '-';

            callBackend('UPDATE_PO', {
                action_type: 'UPDATE', po_id: po.id, customerId: draft.customerId, customerPoNo: draft.customerPoNo,
                poDate: draft.poDate, productId: draft.productId, contractQtyMt: draft.contractQtyMt, tolerancePct: draft.tolerancePct,
                maxInvoiceQtyMt: draft.maxInvoiceQtyMt, incoterm: draft.incoterm, destinationPort: draft.destinationPort,
                shipmentType: draft.shipmentType, containerType: draft.containerType, packaging: draft.packaging,
                packageWeightKg: draft.packageWeightKg, unitsPerContainer: draft.unitsPerContainer,
                totalWeightPerContainerMt: draft.totalWeightPerContainerMt, poCurrency: po.poCurrency || 'USD',
                sellingPrice: draft.sellingPrice, commercialApprovalStatus: po.commercialApprovalStatus || 'APPROVED', poStatus: draft.poStatus
            }, () => {
                Object.assign(po, draft);
                closeModal();
                renderView();
            }, msg => alert('Save PO failed: ' + msg));
        }

        // --- SHIPPING & TRACKING FRONTEND PROTOTYPE (DI-CENTRIC) ---
        function calculateDIPlannedQty(di) {
            if (!di || di.status === 'CANCELLED') return 0;
            const unitKg = parseFloat(di.packageWeightKg) || 0;
            const bagsPerContainer = parseFloat(di.bagsPerContainer) || 0;
            const containers = parseFloat(di.plannedContainers) || 0;
            return (unitKg * bagsPerContainer * containers) / 1000;
        }

        function getDILoadingEvents(diId) {
            return (state.loadingEvents || [])
                .filter(e => e.diId === diId)
                .sort((a, b) => (a.loadingDate || '').localeCompare(b.loadingDate || '') || (a.sequenceNo || 0) - (b.sequenceNo || 0));
        }

        function calculateDIActualQty(di) {
            if (!di) return 0;
            const unitKg = parseFloat(di.packageWeightKg) || 0;
            return getDILoadingEvents(di.id).reduce((sum, event) => {
                return sum + ((parseFloat(event.actualBags) || 0) * unitKg / 1000);
            }, 0);
        }

        function getDIContext(di) {
            const po = (state.pos || []).find(p => p.id === di.poId);
            const customer = po ? (state.customers || []).find(c => c.id === po.customerId) : null;
            const product = po ? (state.products || []).find(p => p.id === po.productId) : null;
            const plannedQty = calculateDIPlannedQty(di);
            const actualQty = calculateDIActualQty(di);
            const loadingEvents = getDILoadingEvents(di.id);
            const actualContainers = loadingEvents.reduce((sum, e) => sum + (parseFloat(e.actualContainers) || 0), 0);
            return { po, customer, product, plannedQty, actualQty, loadingEvents, actualContainers };
        }

        function getSimpleDocuments(di) {
            if (!di.documents || !di.documents.stuffingReport || !di.documents.allShipDoc) {
                const legacyComplete = di.documents && di.documents.status === 'COMPLETE';
                di.documents = {
                    stuffingReport: { status: legacyComplete ? 'RECEIVED' : 'PENDING', receivedDate: '', note: '' },
                    allShipDoc: { status: legacyComplete ? 'RECEIVED' : 'PENDING', receivedDate: '', note: '' }
                };
            }
            return di.documents;
        }

        function getDocumentProgress(di) {
            const docs = getSimpleDocuments(di);
            const items = [docs.stuffingReport, docs.allShipDoc];
            const received = items.filter(x => x && x.status === 'RECEIVED').length;
            return { received, total: 2, complete: received === 2 };
        }


        function getTruckBookingsForEvent(loadingEventId) {
            return (state.truckBookings || []).filter(t => t.loadingEventId === loadingEventId && t.status !== 'CANCELLED');
        }

        function getProviderById(providerId) {
            return (state.logisticsProviders || []).find(p => p.id === providerId) || null;
        }

        function getActiveTruckingProviders() {
            return (state.logisticsProviders || []).filter(p => p.providerType === 'TRUCKING' && p.status === 'ACTIVE');
        }
        function getActiveProvidersByType(providerType) {
            return (state.logisticsProviders || []).filter(p => p.providerType === providerType && p.status === 'ACTIVE');
        }
        function getDIForwarderAssignment(diId) {
            return (state.forwarderAssignments || []).find(x => x.diId === diId && x.status !== 'CANCELLED') || null;
        }
        function getSurveyAssignmentsForEvent(loadingEventId) {
            return (state.surveyAssignments || []).filter(x => x.loadingEventId === loadingEventId && x.status !== 'CANCELLED');
        }

        function getProviderLatestPrice(providerId, containerSize='') {
            const today = getTodayIso();
            return (state.providerPrices || []).filter(x => x.providerId === providerId && x.status === 'ACTIVE' && (!x.validUntil || x.validUntil >= today) && (!containerSize || x.containerSize === containerSize || x.containerSize === '-')).sort((a,b) => String(b.effectiveDate || '').localeCompare(String(a.effectiveDate || '')))[0] || null;
        }

        function getProviderUsage(providerId) {
            const manual = (state.providerUsageRecords || []).filter(x => x.providerId === providerId);
            const truck = (state.truckBookings || []).filter(x => x.providerId === providerId && x.status !== 'CANCELLED').map(x => {
                const ev = (state.loadingEvents || []).find(e => e.id === x.loadingEventId);
                const di = (state.diRecords || []).find(d => d.id === x.diId);
                return { id: `USE-${x.id}`, providerId, usageDate: ev?.loadingDate || '', reference: di?.wcatNo || di?.diNo || x.diId, serviceType: 'Container Trucking', qty: Number(x.noOfContainers || 0), unit: 'containers', priceSnapshot: Number(x.priceSnapshot || 0), currency: x.priceCurrency || '', note: x.bookingReference || '' };
            });
            const forwarder = (state.forwarderAssignments || []).filter(x => x.providerId === providerId && x.status !== 'CANCELLED').map(x => {
                const di = (state.diRecords || []).find(d => d.id === x.diId);
                return { id: `USE-${x.id}`, providerId, usageDate: x.assignedDate || '', reference: di?.wcatNo || di?.diNo || x.diId, serviceType: x.serviceType || 'Freight Forwarder', qty: Number(di?.plannedContainers || 0), unit: 'containers', priceSnapshot: Number(x.priceSnapshot || 0), currency: x.priceCurrency || '', note: x.reference || '' };
            });
            const survey = (state.surveyAssignments || []).filter(x => x.providerId === providerId && x.status !== 'CANCELLED').map(x => {
                const di = (state.diRecords || []).find(d => d.id === x.diId);
                return { id: `USE-${x.id}`, providerId, usageDate: x.surveyDate || '', reference: di?.wcatNo || di?.diNo || x.diId, serviceType: x.surveyType || 'Survey', qty: Number(x.noOfContainers || 0), unit: 'containers', priceSnapshot: Number(x.priceSnapshot || 0), currency: x.priceCurrency || '', note: x.reference || '' };
            });
            return [...manual, ...truck, ...forwarder, ...survey].sort((a,b) => String(b.usageDate || '').localeCompare(String(a.usageDate || '')));
        }

        function setProviderTypeFilter(type) { state.providerTypeFilter = type; state.selectedLogisticsProviderId = null; renderView(); }
        function openLogisticsProvider(providerId) { state.selectedLogisticsProviderId = providerId; state.providerDetailTab = 'PROFILE'; renderView(); }
        function backToLogisticsProviders() { state.selectedLogisticsProviderId = null; renderView(); }
        function setProviderDetailTab(tab) { state.providerDetailTab = tab; renderView(); }

        function renderLogisticsPartners(container) {
            const selected = getProviderById(state.selectedLogisticsProviderId);
            if (selected) return renderLogisticsProviderDetail(container, selected);
            const filter = state.providerTypeFilter || 'ALL';
            const providers = (state.logisticsProviders || []).filter(p => filter === 'ALL' || p.providerType === filter);
            const typeLabel = { TRUCKING:'Trucking', FREIGHT_FORWARDER:'Freight Forwarder', SURVEY:'Survey' };
            container.innerHTML = `<div class="space-y-5">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h2 class="text-xl font-black text-slate-900">Logistics Partners</h2><p class="text-xs text-slate-500 mt-1">ข้อมูลผู้ให้บริการ Logistics, ราคาอ้างอิง และประวัติการใช้งาน</p></div>${canManageLogisticsPartners()?`<button onclick="openProviderEditor()" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">+ Add Partner</button>`:''}</div>
                <div class="flex gap-2 flex-wrap">${['ALL','TRUCKING','FREIGHT_FORWARDER','SURVEY'].map(x=>`<button onclick="setProviderTypeFilter('${x}')" class="px-3 py-1.5 rounded-full border text-[10px] font-bold ${filter===x?'bg-slate-900 text-white border-slate-900':'bg-white text-slate-600'}">${x==='ALL'?'All':typeLabel[x]}</button>`).join('')}</div>
                <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${providers.map(p=>{ const prices=(state.providerPrices||[]).filter(x=>x.providerId===p.id&&x.status==='ACTIVE'); const usage=getProviderUsage(p.id); return `<button onclick="openLogisticsProvider('${p.id}')" class="text-left bg-white border rounded-xl p-5 hover:border-blue-300 hover:shadow-sm"><div class="flex items-start justify-between gap-3"><div><div class="text-[10px] font-bold text-blue-600 uppercase">${typeLabel[p.providerType]||p.providerType}</div><div class="font-black text-slate-900 mt-1">${p.companyName}</div><div class="text-xs text-slate-500 mt-1">${p.contactPerson||'-'} · ${p.phone||'-'}</div></div><span class="px-2 py-1 rounded text-[9px] font-bold ${p.status==='ACTIVE'?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'}">${p.status}</span></div><div class="grid grid-cols-2 gap-2 mt-4 text-[10px]"><div class="bg-slate-50 rounded-lg p-2"><div class="text-slate-400">Active Prices</div><div class="font-black text-slate-800 mt-1">${prices.length}</div></div><div class="bg-slate-50 rounded-lg p-2"><div class="text-slate-400">Usage Records</div><div class="font-black text-slate-800 mt-1">${usage.length}</div></div></div></button>`;}).join('')}</div>
            </div>`;
        }

        function renderLogisticsProviderDetail(container, provider) {
            const tab = state.providerDetailTab || 'PROFILE';
            const prices = (state.providerPrices || []).filter(x => x.providerId === provider.id).sort((a,b)=>String(b.effectiveDate||'').localeCompare(String(a.effectiveDate||'')));
            const usage = getProviderUsage(provider.id);
            const tabBtn = (id,label)=>`<button onclick="setProviderDetailTab('${id}')" class="px-3 py-2 text-xs font-bold border-b-2 ${tab===id?'border-blue-600 text-blue-600':'border-transparent text-slate-500'}">${label}</button>`;
            let body = '';
            if (tab === 'PROFILE') body = `<div class="grid md:grid-cols-2 gap-4 text-xs"><div><div class="text-slate-400">Company Name</div><div class="font-bold mt-1">${provider.companyName}</div></div><div><div class="text-slate-400">Provider Type</div><div class="font-bold mt-1">${provider.providerType}</div></div><div><div class="text-slate-400">Contact</div><div class="font-bold mt-1">${provider.contactPerson||'-'} · ${provider.phone||'-'}</div></div><div><div class="text-slate-400">Email</div><div class="font-bold mt-1">${provider.email||'-'}</div></div><div><div class="text-slate-400">Tax ID</div><div class="font-bold mt-1">${provider.taxId||'-'}</div></div><div><div class="text-slate-400">Status</div><div class="font-bold mt-1">${provider.status}</div></div><div class="md:col-span-2"><div class="text-slate-400">Address</div><div class="font-bold mt-1">${provider.address||'-'}</div></div><div class="md:col-span-2"><div class="text-slate-400">Note</div><div class="font-bold mt-1">${provider.note||'-'}</div></div></div>`;
            if (tab === 'PRICE') body = `<div class="space-y-3">${canManageLogisticsPartners()?`<div class="flex justify-end"><button onclick="openProviderPriceEditor('${provider.id}')" class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">+ Add Price</button></div>`:''}<div class="overflow-x-auto border rounded-xl"><table class="ui-table w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr><th class="p-3 text-left">Service</th><th class="p-3 text-left">Route / Scope</th><th class="p-3">Container</th><th class="p-3 text-right">Price</th><th class="p-3">Effective</th><th class="p-3">Valid Until</th></tr></thead><tbody class="divide-y">${prices.map(x=>`<tr><td class="p-3 font-bold">${x.serviceType}</td><td class="p-3">${x.routeScope||'-'}</td><td class="p-3 text-center">${x.containerSize||'-'}</td><td class="p-3 text-right font-black">${x.currency} ${Number(x.price||0).toLocaleString()}<div class="text-[9px] text-slate-400">${x.unit}</div></td><td class="p-3 text-center">${x.effectiveDate||'-'}</td><td class="p-3 text-center">${x.validUntil||'-'}</td></tr>`).join('') || `<tr><td colspan="6" class="p-6 text-center text-slate-400">No price history</td></tr>`}</tbody></table></div></div>`;
            if (tab === 'USAGE') body = `<div class="overflow-x-auto border rounded-xl"><table class="ui-table w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr><th class="p-3 text-left">Date</th><th class="p-3 text-left">Reference</th><th class="p-3 text-left">Service</th><th class="p-3 text-right">Qty</th><th class="p-3 text-right">Price Snapshot</th><th class="p-3 text-left">Note</th></tr></thead><tbody class="divide-y">${usage.map(x=>`<tr><td class="p-3">${x.usageDate||'-'}</td><td class="p-3 font-bold">${x.reference||'-'}</td><td class="p-3">${x.serviceType||'-'}</td><td class="p-3 text-right">${x.qty||'-'} ${x.unit||''}</td><td class="p-3 text-right font-bold">${x.priceSnapshot?`${x.currency||''} ${Number(x.priceSnapshot).toLocaleString()}`:'-'}</td><td class="p-3">${x.note||'-'}</td></tr>`).join('') || `<tr><td colspan="6" class="p-6 text-center text-slate-400">No usage history</td></tr>`}</tbody></table></div>`;
            container.innerHTML = `<div class="space-y-5"><div class="flex items-start justify-between gap-4"><div><button onclick="backToLogisticsProviders()" class="text-xs font-bold text-slate-500">← Back</button><h2 class="text-xl font-black text-slate-900 mt-2">${provider.companyName}</h2><p class="text-xs text-slate-500 mt-1">${provider.code} · ${provider.providerType}</p></div>${canManageLogisticsPartners()?`<button onclick="openProviderEditor('${provider.id}')" class="px-3 py-2 rounded-lg border text-xs font-bold">Edit Profile</button>`:''}</div><div class="bg-white border rounded-xl"><div class="px-5 pt-2 border-b flex gap-2">${tabBtn('PROFILE','Profile')}${tabBtn('PRICE','Price History')}${tabBtn('USAGE','Usage History')}</div><div class="p-5">${body}</div></div></div>`;
        }

        function openProviderEditor(providerId='') {
            if (!canManageLogisticsPartners()) return alert('เฉพาะ Export หรือ Admin สามารถแก้ไข Logistics Partner ได้');
            const cur = getProviderById(providerId) || {};
            openModal(`<div class="p-6 max-w-2xl"><div class="flex justify-between gap-4"><div><h3 class="font-black">${providerId?'Edit':'Add'} Logistics Partner</h3><p class="text-xs text-slate-500 mt-1">Truck / Freight Forwarder / Survey master</p></div><button onclick="closeModal()">✕</button></div><input id="lgpId" type="hidden" value="${cur.id||''}"><div class="grid md:grid-cols-2 gap-4 mt-5 text-xs"><label class="md:col-span-2">Company Name<input id="lgpName" class="mt-1 w-full border rounded-lg px-3 py-2" value="${cur.companyName||''}"></label><label>Provider Type<select id="lgpType" class="mt-1 w-full border rounded-lg px-3 py-2">${['TRUCKING','FREIGHT_FORWARDER','SURVEY'].map(x=>`<option ${cur.providerType===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status<select id="lgpStatus" class="mt-1 w-full border rounded-lg px-3 py-2">${['ACTIVE','INACTIVE'].map(x=>`<option ${cur.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Contact Person<input id="lgpContact" class="mt-1 w-full border rounded-lg px-3 py-2" value="${cur.contactPerson||''}"></label><label>Phone<input id="lgpPhone" class="mt-1 w-full border rounded-lg px-3 py-2" value="${cur.phone||''}"></label><label>Email<input id="lgpEmail" class="mt-1 w-full border rounded-lg px-3 py-2" value="${cur.email||''}"></label><label>Tax ID<input id="lgpTax" class="mt-1 w-full border rounded-lg px-3 py-2" value="${cur.taxId||''}"></label><label class="md:col-span-2">Address<input id="lgpAddress" class="mt-1 w-full border rounded-lg px-3 py-2" value="${cur.address||''}"></label><label class="md:col-span-2">Note<textarea id="lgpNote" class="mt-1 w-full border rounded-lg px-3 py-2" rows="2">${cur.note||''}</textarea></label></div><div class="mt-5 flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg text-xs font-bold">Cancel</button><button onclick="saveProviderPrototype()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">Save Partner</button></div></div>`);
        }

        function saveProviderPrototype() {
            if (!canManageLogisticsPartners()) return;
            const id = document.getElementById('lgpId')?.value || '';
            const name = (document.getElementById('lgpName')?.value || '').trim();
            if (!name) return alert('กรุณาระบุ Company Name');
            const row = { id: id || `LGP-${String((state.logisticsProviders||[]).length+1).padStart(3,'0')}`, code: getProviderById(id)?.code || `LGP-${String((state.logisticsProviders||[]).length+1).padStart(3,'0')}`, companyName:name, providerType:document.getElementById('lgpType')?.value||'TRUCKING', contactPerson:document.getElementById('lgpContact')?.value||'', phone:document.getElementById('lgpPhone')?.value||'', email:document.getElementById('lgpEmail')?.value||'', address:document.getElementById('lgpAddress')?.value||'', taxId:document.getElementById('lgpTax')?.value||'', status:document.getElementById('lgpStatus')?.value||'ACTIVE', note:document.getElementById('lgpNote')?.value||'' };
            state.logisticsProviders = state.logisticsProviders || [];
            const idx = state.logisticsProviders.findIndex(x=>x.id===row.id); if(idx>=0) state.logisticsProviders[idx]=row; else state.logisticsProviders.push(row);
            state.selectedLogisticsProviderId = row.id; closeModal(); renderView();
        }

        function openProviderPriceEditor(providerId) {
            if (!canManageLogisticsPartners()) return;
            const provider = getProviderById(providerId); if (!provider) return;
            openModal(`<div class="p-6 max-w-2xl"><div class="flex justify-between"><div><h3 class="font-black">Add Price</h3><p class="text-xs text-slate-500 mt-1">${provider.companyName}</p></div><button onclick="closeModal()">✕</button></div><div class="grid md:grid-cols-2 gap-4 mt-5 text-xs"><label>Service Type<input id="lgpPriceService" class="mt-1 w-full border rounded-lg px-3 py-2" value="${provider.providerType==='TRUCKING'?'Container Trucking':provider.providerType==='SURVEY'?'Stuffing Survey':'Ocean Freight'}"></label><label>Route / Scope<input id="lgpPriceRoute" class="mt-1 w-full border rounded-lg px-3 py-2"></label><label>Container Size<input id="lgpPriceContainer" class="mt-1 w-full border rounded-lg px-3 py-2" value="-"></label><label>Unit<input id="lgpPriceUnit" class="mt-1 w-full border rounded-lg px-3 py-2" value="THB / Container"></label><label>Price<input id="lgpPriceValue" type="number" step="0.01" class="mt-1 w-full border rounded-lg px-3 py-2"></label><label>Currency<select id="lgpPriceCurrency" class="mt-1 w-full border rounded-lg px-3 py-2"><option>THB</option><option>USD</option><option>EUR</option></select></label><label>Effective Date<input id="lgpPriceEffective" type="date" class="mt-1 w-full border rounded-lg px-3 py-2" value="${getTodayIso()}"></label><label>Valid Until<input id="lgpPriceValid" type="date" class="mt-1 w-full border rounded-lg px-3 py-2"></label></div><div class="mt-5 flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg text-xs font-bold">Cancel</button><button onclick="saveProviderPricePrototype('${providerId}')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">Save Price</button></div></div>`);
        }

        function saveProviderPricePrototype(providerId) {
            if (!canManageLogisticsPartners()) return;
            const price = Number(document.getElementById('lgpPriceValue')?.value || 0); if (price <= 0) return alert('กรุณาระบุราคา');
            state.providerPrices = state.providerPrices || [];
            state.providerPrices.push({ id:`LGPPR-${String(state.providerPrices.length+1).padStart(3,'0')}`, providerId, serviceType:document.getElementById('lgpPriceService')?.value||'', routeScope:document.getElementById('lgpPriceRoute')?.value||'', containerSize:document.getElementById('lgpPriceContainer')?.value||'-', unit:document.getElementById('lgpPriceUnit')?.value||'', price, currency:document.getElementById('lgpPriceCurrency')?.value||'THB', effectiveDate:document.getElementById('lgpPriceEffective')?.value||getTodayIso(), validUntil:document.getElementById('lgpPriceValid')?.value||'', status:'ACTIVE', note:'' });
            closeModal(); state.providerDetailTab='PRICE'; renderView();
        }

        function getTruckAllocationSummary(loadingEventId) {
            const event = (state.loadingEvents || []).find(e => e.id === loadingEventId);
            const planned = Number(event?.plannedContainers || 0);
            const allocations = getTruckBookingsForEvent(loadingEventId);
            const allocated = allocations.reduce((sum, t) => sum + Number(t.noOfContainers || 0), 0);
            const confirmed = allocations.filter(t => ['CONFIRMED','COMPLETED'].includes(t.status)).reduce((sum, t) => sum + Number(t.noOfContainers || 0), 0);
            return { planned, allocated, confirmed, remaining: Math.max(0, planned - allocated), complete: planned > 0 && allocated === planned };
        }

        function getTruckPendingLoadingEvents() {
            const scopedDiIds = new Set(getScopedDIRecords().filter(d => d.booking && d.booking.status !== 'CANCELLED').map(d => d.id));
            return (state.loadingEvents || []).filter(e => scopedDiIds.has(e.diId) && e.status !== 'CANCELLED').filter(e => {
                const summary = getTruckAllocationSummary(e.id);
                const openStatus = getTruckBookingsForEvent(e.id).some(t => !['CONFIRMED','COMPLETED'].includes(t.status));
                return summary.remaining > 0 || openStatus;
            });
        }

        function renderTruckAllocationForEvent(di, event) {
            const rows = getTruckBookingsForEvent(event.id);
            const a = getTruckAllocationSummary(event.id);
            const tone = a.remaining > 0 ? 'border-amber-200 bg-amber-50' : (a.confirmed < a.planned ? 'border-blue-200 bg-blue-50' : 'border-emerald-200 bg-emerald-50');
            return `<div class="rounded-xl border ${tone} overflow-hidden">
                <div class="p-3 flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <div><div class="text-xs font-black text-slate-900">${event.loadingDate} · Sequence ${event.sequenceNo}</div><div class="text-[10px] text-slate-500">Allocated <strong>${a.allocated} / ${a.planned}</strong> containers · Confirmed ${a.confirmed}${a.remaining > 0 ? ` · <span class="text-amber-700 font-bold">${a.remaining} still need truck booking</span>` : ''}</div></div>

                truckPlate: document.getElementById('truckPlate')?.value || '',
                note: document.getElementById('truckNote')?.value || '',
                priceSnapshot: Number(getProviderLatestPrice(providerId, document.getElementById('truckContainerSize')?.value || '')?.price || 0),
                priceCurrency: getProviderLatestPrice(providerId, document.getElementById('truckContainerSize')?.value || '')?.currency || '',
                priceUnit: getProviderLatestPrice(providerId, document.getElementById('truckContainerSize')?.value || '')?.unit || ''
            };
            state.truckBookings = state.truckBookings || [];
            const idx = state.truckBookings.findIndex(t => t.id === row.id);
            if (idx >= 0) state.truckBookings[idx] = row; else state.truckBookings.push(row);
            closeModal(); renderView();
        }

        function cancelTruckAllocationPrototype(truckBookingId) {
            if (!canManageTruckAllocation()) return alert('เฉพาะ Export หรือ Admin สามารถแก้ไข Truck Allocation ได้');
            const row = (state.truckBookings || []).find(t => t.id === truckBookingId);
            if (!row) return;
            row.status = 'CANCELLED';
            renderView();
        }

        function formatMT(value) {
            return `${(parseFloat(value) || 0).toFixed(3)} MT`;
        }

        function getStatusBadgeClass(status) {
            const map = {
                DRAFT: 'bg-slate-100 text-slate-600',
                PLANNED: 'bg-amber-100 text-amber-800',
                WCAT_ASSIGNED: 'bg-amber-100 text-amber-800',
                BOOKED: 'bg-blue-100 text-blue-800',
                LOADING: 'bg-blue-100 text-blue-800',
                SHIPPED: 'bg-blue-100 text-blue-800',
                DOCUMENTS_PENDING: 'bg-amber-100 text-amber-800',
                COMPLETED: 'bg-emerald-100 text-emerald-800',
                CANCELLED: 'bg-red-100 text-red-700',
                RECEIVED: 'bg-emerald-100 text-emerald-700',
                PENDING: 'bg-amber-100 text-amber-700',
                ACTIVE: 'bg-blue-100 text-blue-800',
                REVISED: 'bg-amber-100 text-amber-800',
                LOADED: 'bg-emerald-100 text-emerald-800',
                READY: 'bg-amber-100 text-amber-800',
                CONFIRMED: 'bg-emerald-100 text-emerald-800'
            };
            return map[status] || 'bg-slate-100 text-slate-700';
        }

        function getCanonicalDIStatus(di) {
            if (!di || di.status === 'CANCELLED') return 'CANCELLED';
            const ctx = getDIContext(di);
            if (getDocumentProgress(di).complete) return 'COMPLETED';
            if (ctx.actualQty >= ctx.plannedQty && ctx.plannedQty > 0) return 'DOCUMENTS_PENDING';
            if (ctx.actualQty > 0) return 'LOADING';
            if (di.booking && di.booking.status !== 'CANCELLED') return 'BOOKED';
            if (di.wcatNo) return 'WCAT_ASSIGNED';
            return 'PLANNED';
        }

        function renderWorkflowStageIndicator(di) {
            const stage = deriveDIStage(di);
            const steps = ['DI','WCAT','BOOKING','SHIPMENT','DOCUMENTS'];
            const currentIndex = Math.max(0, steps.indexOf(stage === 'COMPLETED' ? 'DOCUMENTS' : stage));
            return `<div class="grid grid-cols-5 gap-2">${steps.map((s, idx) => `<div class="relative"><div class="h-1.5 rounded-full ${idx <= currentIndex ? 'bg-blue-600' : 'bg-slate-200'}"></div><div class="mt-2 flex items-center gap-1 text-[9px] font-bold uppercase ${idx <= currentIndex ? 'text-blue-700' : 'text-slate-400'}">${idx < currentIndex || stage === 'COMPLETED' ? '<span>✓</span>' : idx === currentIndex ? '<span>●</span>' : '<span>○</span>'}<span>${s}</span></div></div>`).join('')}</div>`;
        }

        function renderDIBreadcrumb(di, ctx) {
            const poLabel = ctx.po?.customerPoNo || ctx.po?.id || '-';
            const wcatLabel = di.wcatNo || 'Waiting WCAT';
            return `<!-- PO > DI > WCAT --><div class="flex flex-wrap items-center gap-1.5 text-[10px] font-semibold text-slate-500"><button onclick="goToPODetail('${di.poId}')" class="hover:text-blue-700">${poLabel}</button><span class="text-slate-300">›</span><span class="text-slate-800">${di.diNo}</span><span class="text-slate-300">›</span><span class="font-mono ${di.wcatNo ? 'text-purple-700' : 'text-amber-600'}">${wcatLabel}</span></div>`;
        }

        function getActionButtonClass(action) {
            if (/Cancel|Delete/.test(action)) return 'border-red-200 bg-red-50 text-red-700 hover:bg-red-100';
            if (/Mark Received|Complete/.test(action)) return 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100';
            if (/Edit|Revise/.test(action)) return 'border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100';
            if (/Add|Assign|Create/.test(action)) return 'border-blue-600 bg-blue-600 text-white hover:bg-blue-700';
            return 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50';
        }

        function deriveDIStage(di) {
            if (!di || di.status === 'CANCELLED') return 'CANCELLED';
            const ctx = getDIContext(di);
            if (getDocumentProgress(di).complete) return 'COMPLETED';
            if (ctx.actualQty > 0) return ctx.actualQty >= ctx.plannedQty ? 'DOCUMENTS' : 'SHIPMENT';
            if (di.booking && di.booking.status !== 'CANCELLED') return 'BOOKING';
            if (di.wcatNo) return 'WCAT';
            return 'DI';
        }

        function viewDIDetail(diId) {
            state.selectedDiId = diId;
            state.currentView = 'shipping';
            renderSidebar();
            renderView();
        }

        function setShippingFilter(filter) {
            state.shippingFilter = filter || 'ALL';
            state.selectedDiId = null;
            renderView();
        }

        function renderShipping(container) {
            if (state.currentUser.role === 'PRODUCTION_WAREHOUSE') { renderProductionOrders(container); return; }
            const selectedDI = state.selectedDiId ? getScopedDIRecords().find(d => d.id === state.selectedDiId) : null;
            if (selectedDI) {
                if (state.lastLoadedShipmentId !== selectedDI.id) {
                    state.lastLoadedShipmentId = selectedDI.id;
                    (async () => {
                        try {
                            const po = getDIContext(selectedDI).po || {};
                            await ensureShipmentAnchorToApi(selectedDI.id, {
                                poId: selectedDI.poId,
                                customerId: selectedDI.customerId || po.customerId,
                                productId: selectedDI.productId || po.productId,
                                isOneContainer: selectedDI.plannedContainers === 1 ? 1 : 0
                            });
                            await loadShipmentDetailFromApi(selectedDI.id);
                            await loadShipmentExpensesFromApi(selectedDI.id);
                            await loadShipmentDocumentLinksFromApi(selectedDI.id);
                            await loadExpenseCategoriesFromApi();
                            await loadFreightQuotesFromApi();
                        } catch (err) {
                            console.error(err);
                        }
                    })();
                }
                container.innerHTML = renderDIDetail(selectedDI);
            } else {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                            <div>
                                <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider text-blue-600 mb-1">
                                    <span>Frontend Prototype</span><span class="text-slate-300">•</span><span>Mock Data Only</span>
                                </div>
                                <h2 class="text-xl font-bold text-slate-900">การส่งออก & ติดตามสถานะ (Export Tracking)</h2>
                                <p class="text-xs text-slate-500 mt-1">PO → DI → WCAT / Invoice → Booking → Truck Allocation → Loading → Documents</p>
                            </div>
                            ${canCreateDI() ? `<button onclick="openCreateDIPrototype()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 shadow-sm"><i data-lucide="plus-circle" class="w-4 h-4"></i><span>Create DI</span></button>` : ''}
                        </div>
                        ${renderShippingSummaryCards()}
                        ${renderExportPipeline()}
                        ${renderDITrackingTable()}
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function renderShippingSummaryCards() {
            const active = getScopedDIRecords().filter(d => d.status !== 'CANCELLED' && deriveDIStage(d) !== 'COMPLETED');
            const waitingWcat = active.filter(d => !d.wcatNo);
            const bookingActive = active.filter(d => d.booking && d.booking.status !== 'CANCELLED');
            const today = '2026-08-21'; // prototype date to make mock loading visible
            const todayEvents = (state.loadingEvents || []).filter(e => e.loadingDate === today && e.status !== 'CANCELLED');
            const todayDI = new Set(todayEvents.map(e => e.diId)).size;
            const todayContainers = todayEvents.reduce((sum, e) => sum + (parseFloat(e.plannedContainers) || 0), 0);
            const docsPending = active.filter(d => calculateDIActualQty(d) > 0 && !getDocumentProgress(d).complete);
            const truckPending = getTruckPendingLoadingEvents();

            const cards = [
                { key: 'ACTIVE', label: 'Active DI', value: active.length, sub: 'งานที่ยังไม่ปิด', icon: 'layers-3' },
                { key: 'WAITING_WCAT', label: 'Waiting WCAT', value: waitingWcat.length, sub: 'รอทีมเอกสารกำหนด INV', icon: 'file-clock' },
                { key: 'BOOKING', label: 'Booking Active', value: bookingActive.length, sub: 'มี Booking ปัจจุบัน', icon: 'ship' },
                { key: 'TRUCK', label: 'Truck Booking Pending', value: truckPending.length, sub: 'Allocation / confirmation incomplete', icon: 'truck' },
                { key: 'TODAY', label: 'Loading Today', value: `${todayDI} DI`, sub: `${todayContainers} Containers`, icon: 'calendar-check-2' },
                { key: 'DOCUMENTS', label: 'Documents Pending', value: docsPending.length, sub: 'โหลดแล้ว / เอกสารยังไม่ครบ', icon: 'file-text' }
            ];

            return `
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-3">
                    ${cards.map(card => `
                        <button onclick="setShippingFilter('${card.key}')" class="text-left bg-white rounded-xl border ${state.shippingFilter === card.key ? 'border-blue-500 ring-2 ring-blue-100' : 'border-slate-200'} p-4 shadow-sm hover:border-blue-300 hover:shadow-md transition-all">
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] uppercase font-bold tracking-wide text-slate-500">${card.label}</span>
                                <i data-lucide="${card.icon}" class="w-4 h-4 text-blue-600"></i>
                            </div>
                            <div class="text-2xl font-black text-slate-900 mt-2">${card.value}</div>
                            <div class="text-[10px] text-slate-400 mt-1">${card.sub}</div>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function renderExportPipeline() {
            const active = getScopedDIRecords().filter(d => d.status !== 'CANCELLED');
            const stages = [
                { key: 'DI', label: 'DI', count: active.filter(d => deriveDIStage(d) === 'DI').length, sub: 'Plan created' },
                { key: 'WCAT', label: 'WCAT / INV', count: active.filter(d => deriveDIStage(d) === 'WCAT').length, sub: 'Invoice assigned' },
                { key: 'BOOKING', label: 'Booking', count: active.filter(d => deriveDIStage(d) === 'BOOKING').length, sub: 'Booked / revised' },
                { key: 'SHIPMENT', label: 'Shipment', count: active.filter(d => deriveDIStage(d) === 'SHIPMENT').length, sub: 'Loading in progress' },
                { key: 'DOCUMENTS', label: 'Documents', count: active.filter(d => ['DOCUMENTS','COMPLETED'].includes(deriveDIStage(d))).length, sub: 'Post-loading docs' }
            ];

            return `
                <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3 class="text-sm font-bold text-slate-900">Export Pipeline</h3>
                            <p class="text-[10px] text-slate-400">กดแต่ละขั้นเพื่อกรอง Main Tracking Table</p>
                        </div>
                        <button onclick="setShippingFilter('ALL')" class="text-[10px] font-bold text-blue-600 hover:underline">Clear filter</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-2">
                        ${stages.map((stage, idx) => `
                            <button onclick="setShippingFilter('${stage.key}')" class="relative text-left rounded-lg border ${state.shippingFilter === stage.key ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-slate-50'} p-3 hover:border-blue-300 transition-colors">
                                <div class="text-[10px] uppercase font-bold text-slate-500">${stage.label}</div>
                                <div class="text-xl font-black text-slate-900 mt-1">${stage.count}</div>
                                <div class="text-[9px] text-slate-400">${stage.sub}</div>
                                ${idx < stages.length - 1 ? '<i data-lucide="chevron-right" class="hidden md:block absolute -right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 z-10"></i>' : ''}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function filterDIRecords(records) {
            const f = state.shippingFilter || 'ALL';
            if (f === 'ALL') return records.filter(d => d.status !== 'CANCELLED');
            if (f === 'ACTIVE') return records.filter(d => d.status !== 'CANCELLED' && deriveDIStage(d) !== 'COMPLETED');
            if (f === 'WAITING_WCAT') return records.filter(d => d.status !== 'CANCELLED' && !d.wcatNo);
            if (f === 'TODAY') {
                const todayIds = new Set((state.loadingEvents || []).filter(e => e.loadingDate === '2026-08-21').map(e => e.diId));
                return records.filter(d => todayIds.has(d.id));
            }
            if (f === 'DOCUMENTS') return records.filter(d => ['DOCUMENTS','COMPLETED'].includes(deriveDIStage(d)));
            return records.filter(d => deriveDIStage(d) === f || (f === 'BOOKING' && deriveDIStage(d) === 'BOOKING'));
        }

        function stageBadge(stage) {
            const stageToStatus = { DI:'PLANNED', WCAT:'WCAT_ASSIGNED', BOOKING:'BOOKED', SHIPMENT:'LOADING', DOCUMENTS:'DOCUMENTS_PENDING', COMPLETED:'COMPLETED', CANCELLED:'CANCELLED' };
            const label = stageToStatus[stage] || stage;
            return `<span class="px-2 py-1 rounded-md text-[10px] font-bold ${getStatusBadgeClass(label)}">${label}</span>`;
        }

        function renderDITrackingTable() {
            const records = filterDIRecords(getScopedDIRecords());
            return `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-slate-200 bg-slate-50/70 flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <div>
                            <h3 class="text-sm font-bold text-slate-900">Main Tracking Table</h3>
                            <p class="text-[10px] text-slate-400">Primary row = DI • Filter: <strong class="text-blue-600">${state.shippingFilter || 'ALL'}</strong></p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="setShippingFilter('ALL')" class="px-3 py-1.5 rounded border border-slate-300 bg-white text-[10px] font-bold text-slate-600">Active only</button>
                            <button onclick="state.shippingFilter='CANCELLED'; renderView();" class="px-3 py-1.5 rounded border border-slate-300 bg-white text-[10px] font-bold text-slate-500">Cancelled</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="ui-table w-full min-w-[1260px] text-left text-xs">
                            <thead class="bg-slate-100 text-slate-600 uppercase text-[10px] font-bold border-b border-slate-200">
                                <tr>
                                    <th class="p-3">DI No.</th><th class="p-3">WCAT / INV</th><th class="p-3">Customer</th><th class="p-3">PO</th><th class="p-3">Product</th>
                                    <th class="p-3 text-right">Planned Qty</th><th class="p-3">Container Plan</th><th class="p-3">Loading Progress</th>
                                    <th class="p-3">Booking</th><th class="p-3 text-center">Stage</th><th class="p-3 text-center">Documents</th><th class="p-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                ${records.length ? records.map(di => {
                                    const ctx = getDIContext(di);
                                    const pct = ctx.plannedQty > 0 ? Math.min(100, Math.round((ctx.actualQty / ctx.plannedQty) * 100)) : 0;
                                    const docsDone = di.documents?.done || 0;
                                    const docsTotal = di.documents?.total || 0;
                                    const stage = deriveDIStage(di);
                                    return `
                                        <tr class="hover:bg-blue-50/40 transition-colors">
                                            <td class="p-3"><button onclick="viewDIDetail('${di.id}')" class="font-black text-blue-600 hover:underline">${di.diNo}</button><div class="text-[9px] text-slate-400 font-mono mt-0.5">${di.id}</div></td>
                                            <td class="p-3"><span class="font-mono font-bold ${di.wcatNo ? 'text-slate-900' : 'text-amber-600'}">${di.wcatNo || 'Waiting WCAT'}</span></td>
                                            <td class="p-3"><div class="font-bold text-slate-900">${ctx.customer?.name || '-'}</div></td>
                                            <td class="p-3"><button onclick="goToPODetail('${ctx.po?.id || ''}')" class="font-bold text-blue-600 hover:text-blue-800 hover:underline underline-offset-2 inline-flex items-center gap-1">${ctx.po?.customerPoNo || ctx.po?.id || '-'}<i data-lucide="arrow-up-right" class="w-3 h-3"></i></button></td>
                                            <td class="p-3 font-semibold text-slate-700">${ctx.product?.shortName || ctx.product?.name || '-'}</td>
                                            <td class="p-3 text-right font-black text-slate-900">${ctx.plannedQty.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3})} MT</td>
                                            <td class="p-3"><div class="font-bold">${di.plannedContainers} × ${di.containerType}</div><div class="text-[10px] text-slate-500">${di.bagsPerContainer} bags × ${di.packageWeightKg} kg</div></td>
                                            <td class="p-3 min-w-[160px]"><div class="flex justify-between text-[10px] font-bold"><span>${ctx.actualContainers}/${di.plannedContainers} Cont.</span><span>${pct}%</span></div><div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="h-full bg-blue-600" style="width:${pct}%"></div></div><div class="text-[9px] text-slate-400 mt-1">${ctx.actualQty.toFixed(3)} / ${formatMT(ctx.plannedQty)}</div></td>
                                            <td class="p-3"><div class="font-mono font-bold text-slate-800">${di.booking?.bookingNo || '-'}</div><div class="text-[9px] ${di.booking?.status === 'REVISED' ? 'text-amber-600' : 'text-slate-400'}">${di.booking ? `${di.booking.status} • ${di.booking.revisionNo}` : 'Not booked'}</div></td>
                                            <td class="p-3 text-center">${stageBadge(stage)}</td>
                                            <td class="p-3 text-center"><div class="font-bold text-slate-800">${docsDone}/${docsTotal}</div><div class="text-[9px] text-slate-400">${getDocumentProgress(di).complete ? 'COMPLETE' : 'PENDING'}</div></td>
                                            <td class="p-3 text-right"><button onclick="viewDIDetail('${di.id}')" class="text-blue-600 font-bold hover:underline">View Detail</button></td>
                                        </tr>
                                    `;
                                }).join('') : `<tr><td colspan="12" class="p-10 text-center text-slate-400">ไม่มี DI ใน filter นี้</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderDIDetail(di) {
            const ctx = getDIContext(di);
            const stage = deriveDIStage(di);
            const remaining = Math.max(0, ctx.plannedQty - ctx.actualQty);
            const poAllocated = (state.diRecords || []).filter(d => d.poId === di.poId && d.status !== 'CANCELLED').reduce((sum, d) => sum + calculateDIPlannedQty(d), 0);
            const poContract = parseFloat(ctx.po?.contractQtyMt) || 0;
            const poAvailable = Math.max(0, poContract - poAllocated);
            const steps = ['DI','WCAT','BOOKING','SHIPMENT','DOCUMENTS'];
            const currentIndex = Math.max(0, steps.indexOf(stage === 'COMPLETED' ? 'DOCUMENTS' : stage));

            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <button onclick="state.selectedDiId=null; renderView();" class="flex items-center gap-2 text-xs font-bold text-slate-600 bg-white border border-slate-200 rounded-lg px-3 py-2 shadow-sm hover:bg-slate-50"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Tracking</button>
                            ${ctx.po ? `<button onclick="goToPODetail('${di.poId}')" class="flex items-center gap-2 text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 shadow-sm hover:bg-blue-100"><i data-lucide="file-text" class="w-4 h-4"></i> Back to PO</button>` : ''}
                        </div>
                        <div class="flex gap-2">${['ADMIN','SALES_SUPPORT','EXPORT'].includes(state.currentUser.role) ? renderDIQuickActions(di, stage) : ''}</div>
                    </div>

                    ${renderDIBreadcrumb(di, ctx)}
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                        <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-5">
                            <div>
                                <div class="flex items-center gap-3 flex-wrap"><h1 class="text-2xl font-black text-slate-900">${di.diNo}</h1><span class="px-2 py-1 rounded-md text-[10px] font-bold ${getStatusBadgeClass(getCanonicalDIStatus(di))}">${getCanonicalDIStatus(di)}</span><span class="text-xs font-mono font-bold ${di.wcatNo ? 'text-purple-700 bg-purple-50 border-purple-200' : 'text-amber-700 bg-amber-50 border-amber-200'} border px-2.5 py-1 rounded">${di.wcatNo || 'Waiting WCAT / Invoice'}</span></div>
                                <div class="text-[10px] text-slate-400 mt-1">Current Stage: <strong class="text-slate-700">${stage}</strong></div>
                                <div class="text-xs text-slate-500 mt-2">${ctx.customer?.name || '-'} • ${ctx.po?.customerPoNo || ctx.po?.id || '-'} • ${ctx.product?.shortName || ctx.product?.name || '-'}</div>
                            </div>
                            <div class="grid grid-cols-3 gap-3 text-right min-w-[390px]">
                                <div><div class="text-[9px] uppercase font-bold text-slate-400">Planned</div><div class="font-black text-slate-900">${ctx.plannedQty.toFixed(3)} MT</div></div>
                                <div><div class="text-[9px] uppercase font-bold text-slate-400">Loaded</div><div class="font-black text-emerald-600">${formatMT(ctx.actualQty)}</div></div>
                                <div><div class="text-[9px] uppercase font-bold text-slate-400">Remaining</div><div class="font-black text-amber-600">${formatMT(remaining)}</div></div>
                            </div>
                        </div>

                        <div class="mt-5 pt-4 border-t border-slate-100">${renderWorkflowStageIndicator(di)}</div>
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                        <div class="xl:col-span-2 space-y-6">
                            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4"><div class="flex items-center gap-2"><i data-lucide="package-check" class="w-4 h-4 text-blue-600"></i><h3 class="text-sm font-bold text-slate-900">Delivery Plan & Container / Packing Plan</h3></div><button onclick="openEditDIPlanPrototype('${di.id}')" class="text-xs font-bold text-amber-600 hover:underline flex items-center gap-1"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Edit DI Plan</button></div>
